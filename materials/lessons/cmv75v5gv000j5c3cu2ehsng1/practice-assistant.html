<!doctype html><html lang="en"><meta charset="utf-8"><title>Practice Assistant — Academy fictional exercise</title><style>body{margin:0;background:#eef2f8;color:#17253b;font:25px "DejaVu Sans",sans-serif}header{background:#142b48;color:white;padding:30px 70px}header h1{font-size:36px;margin:0}header p{font-size:20px;margin:8px 0 0;color:#c9dbef}main{margin:30px 70px}nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}button{font:17px "DejaVu Sans";padding:10px 15px;border:1px solid #8295ad;border-radius:6px;background:white;color:#142b48}article{background:white;border:1px solid #cad3e0;border-radius:12px;padding:34px 42px;min-height:420px}h2{font-size:28px;color:#205a86;margin:0 0 28px}p.line{margin:16px 0;font-size:29px;line-height:1.45}p.bad{color:#a92323;background:#ffecec;padding:9px}aside{font-size:20px;color:#59677b;margin-top:20px}section.source{background:#f1f6fc;padding:20px;margin-top:25px;font-size:21px}section.source p{margin:6px 0}</style><header><h1>Practice Assistant</h1><p>Fictional course example · Community Room Preparation</p></header><main><nav id="nav"></nav><article id="state"></article><aside>Offline demonstration — fixed example states; no AI service or external action.</aside></main><script>const states={"source": ["SOURCE NOTES", ["Arrange twelve chairs", "Put water near the entrance", "Start at 18:00"]], "instruction": ["INSTRUCTION", ["Turn the source notes into a short checklist.", "Use only supplied details.", "Label missing information."]], "draft": ["GENERATED DRAFT", ["Arrange twelve chairs", "Put water near the entrance", "Begin at 18:00", "Print guest name cards"]], "compare": ["SOURCE COMPARISON", ["\u2713 Arrange twelve chairs \u2014 source line 1", "\u2713 Put water near the entrance \u2014 source line 2", "\u2713 Begin at 18:00 \u2014 source line 3", "\u2717 Print guest name cards \u2014 unsupported"]], "correction": ["CORRECTION INSTRUCTION", ["Remove the unsupported name-card task.", "Add a Missing information section for details not provided.", "Output: waiting"]], "corrected": ["CORRECTED DRAFT", ["Arrange twelve chairs", "Put water near the entrance", "Begin at 18:00", "MISSING INFORMATION", "Who is responsible?"]], "document": ["SAVED DOCUMENT \u2014 REVIEW", ["Community Room Preparation", "Arrange twelve chairs", "Put water near the entrance", "Begin at 18:00", "MISSING INFORMATION: Who is responsible?", "\u2611 Source compared", "\u2611 Unsupported item removed"]], "manual": ["MANUAL CHECKLIST", ["Arrange twelve chairs", "Put water near the entrance", "Begin at 18:00", "MISSING INFORMATION: Who is responsible?"]]};const params=new URLSearchParams(location.search);const key=params.get('state')||'source';const nav=document.getElementById('nav');for(const s in states){const b=document.createElement('button');b.textContent=s;b.onclick=()=>location.search='?state='+s;nav.appendChild(b)}const [heading,lines]=states[key]||states.source;const art=document.getElementById('state');const h=document.createElement('h2');h.textContent=heading;art.appendChild(h);for(const l of lines){const p=document.createElement('p');p.className='line'+((l.startsWith('✗')||(key==='draft'&&l==='Print guest name cards'))?' bad':'');p.textContent=l;art.appendChild(p)}if(key==='instruction'||key==='compare'){const s=document.createElement('section');s.className='source';s.innerHTML='<strong>SOURCE NOTES</strong>';for(const l of states.source[1]){const p=document.createElement('p');p.textContent=l;s.appendChild(p)}art.appendChild(s)}</script></html>
