<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Course Automation Monitor training simulation v1.0</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#183044;font:18px system-ui,sans-serif}main{max-width:1460px;margin:54px auto;padding:24px 40px;background:white;border:1px solid #cad7e1;border-radius:12px}h1{font-size:30px;margin:0}h2{font-size:27px}h3{font-size:21px}.banner{background:#fff3cd;padding:10px;border-radius:5px;font-weight:650}.muted{color:#51677a}nav{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}button{font:inherit;padding:10px 14px;border:1px solid #658097;border-radius:6px;background:#f6faff;color:#17374d;cursor:pointer}button:hover{background:#dceef7}table{border-collapse:collapse;width:100%;font-size:18px}th,td{padding:13px;text-align:left;border-bottom:1px solid #cbd7e0}th{background:#e9f2f7}.cards{display:flex;gap:20px;flex-wrap:wrap}.card{padding:20px;background:#f1f7fa;border:1px solid #cbd7e0;border-radius:8px;min-width:210px}.big{font-size:35px;font-weight:700}.ok{color:#1b6942}.warn{color:#8a420a}progress{width:80%;height:28px}.steps{display:flex;gap:16px;margin:25px 0}.steps div{padding:20px;border:1px solid #a4c4d5;border-radius:8px}.note{padding:15px;background:#f1f5f8;border-left:5px solid #6d8ea4}.hidden{display:none}</style><main><h1>Course Automation Monitor</h1><p class="muted">Training simulation v1.0 · Community Workshop Reply Drafts</p><p class="banner">SAMPLE DATA — fictional account and activity; no real charges or external actions</p><nav><button data-view="overview">Workflow</button><button data-view="history">Run History</button><button data-view="usage">Usage & counting rules</button><button data-view="spike">Investigate spike</button><button id="reset">Reset sample</button></nav><section id="content"></section><p class="muted">Draft-only workflow. Human review is required. Nothing is sent automatically.</p></main><script>const DATA={"label":"FICTIONAL TRAINING DATA \u2014 NOT LIVE PROVIDER RECORDS","product":"Course Automation Monitor training simulation v1.0","workflow":"Community Workshop Reply Drafts","draftOnly":true,"period":"15 October 2026","runs":[{"id":"RUN-101","request":"CW-101","started":"2026-10-15 08:00 UTC","status":"Completed","completedSteps":3,"units":2,"exception":false,"steps":[["Trigger","Succeeded",0],["Create draft","Succeeded",1],["Save for review","Succeeded",1]]},{"id":"RUN-102","request":"CW-102","started":"2026-10-15 08:20 UTC","status":"Completed","completedSteps":3,"units":2,"exception":false,"steps":[["Trigger","Succeeded",0],["Create draft","Succeeded",1],["Save for review","Succeeded",1]]},{"id":"RUN-103","request":"CW-103","started":"2026-10-15 08:40 UTC","status":"Failed","completedSteps":2,"units":2,"exception":true,"steps":[["Trigger","Succeeded",0],["Prepare draft operation","Succeeded",1],["Create draft","Failed",1]]},{"id":"RUN-104","request":"CW-104","topic":"Accessibility question","started":"2026-10-15 09:00 UTC","status":"Completed","completedSteps":3,"units":2,"exception":false,"steps":[["Trigger","Succeeded",0],["Create draft","Succeeded",1],["Save for review","Succeeded",1]]},{"id":"RUN-105","request":"CW-105","started":"2026-10-15 09:20 UTC","status":"Retried then completed","completedSteps":3,"units":3,"exception":true,"steps":[["Trigger","Succeeded",0],["Create draft \u2014 first attempt","Failed",1],["Create draft \u2014 retry","Succeeded",1],["Save for review","Succeeded",1]]}],"account":{"actualUsage":146,"limit":500,"unit":"training usage units","cost":null,"billedAmount":null,"checkedDate":"2026-10-15"},"estimate":{"expectedRuns":120,"unitsPerNormalRun":2,"variationFraction":0.2,"estimatedUnits":288},"pending":[{"requestId":"PENDING-01","topic":"Opening hours","status":"Preserved for manual review"},{"requestId":"PENDING-02","topic":"Accessibility question","status":"Preserved for manual review"},{"requestId":"PENDING-03","topic":"Workshop dates","status":"Preserved for manual review"},{"requestId":"PENDING-04","topic":"Materials list","status":"Preserved for manual review"},{"requestId":"PENDING-05","topic":"Venue directions","status":"Preserved for manual review"},{"requestId":"PENDING-06","topic":"Booking deadline","status":"Preserved for manual review"},{"requestId":"PENDING-07","topic":"Group size","status":"Preserved for manual review"}]};let paused=false;const el=document.querySelector('#content');const sum=DATA.runs.reduce((a,r)=>a+r.units,0);function row(r){return `<tr><td><button data-run="${r.id}">${r.id}</button></td><td>${r.started}</td><td>${r.status}</td><td>${r.completedSteps}</td><td>${r.units}</td></tr>`}function show(view){if(view==='overview'){el.innerHTML=`<h2>Workflow overview</h2><p>Status: <strong id="workflowStatus" class="ok">${paused?'Paused':'Active'}</strong></p><div class="steps"><div>1. Trigger<br>Form request</div><div>2. Create draft<br>For human review</div><div>3. Save for review<br>No send step</div></div><p class="note">This teaching workflow creates a draft only. It does not send messages.</p>`}else if(view==='history'){el.innerHTML=`<h2>Run History — 15 October 2026</h2><p>5 runs · ${sum} training usage units · 2 runs affected by failure or retry</p><table><thead><tr><th>Run identifier</th><th>Start time</th><th>Status</th><th>Completed steps</th><th>Usage units</th></tr></thead><tbody>${DATA.runs.map(row).join('')}</tbody></table><p class="note">Select a run to inspect steps. Failed operations may still count under this fictional training rule.</p>`}else if(view==='usage'){el.innerHTML=`<h2>Usage — current sample period</h2><p class="banner">SAMPLE ACCOUNT VALUES — not a provider plan or bill</p><div class="cards"><div class="card">Actual usage<div class="big">146 units</div></div><div class="card">Account limit<div class="big">500 units</div></div><div class="card">Remaining allowance<div class="big">354 units</div></div></div><p><progress value="146" max="500"></progress></p><button id="counting">View counting rules</button><div id="rules" class="hidden note"><h3>Fictional counting rules</h3><p>Normal create-draft and save-for-review actions each count one unit; trigger counts zero. A counted failed action still consumes a unit. RUN-103 records preparation and a failed draft as two units. RUN-105 records failed draft, retry and save as three units.</p><p>The five-run subset consumes 11 of the whole period's 146 units. Do not add it twice. Real services may count tasks, credits, operations, polling or AI use differently.</p><p>Estimated cost: unknown. Actual billed amount: unknown. No billing terms were supplied.</p></div>`}else if(view==='spike'){el.innerHTML=`<h2>Investigate unexpected repetition</h2><p class="warn">SAMPLE ALERT: repeated checks and retries require investigation.</p><div class="cards"><div class="card">Workflow status<div class="big" id="spikeStatus">${paused?'Paused':'Active'}</div></div><div class="card">Preserved pending inputs<div class="big" id="pendingCount">7</div></div></div><p><button id="pause">${paused?'Workflow paused':'Pause Workflow'}</button></p><p class="note">Preserve inputs and recent activity. Handle urgent requests manually as drafts. Do not delete evidence or restart blindly.</p><table><tr><th>Request ID</th><th>Fictional topic</th><th>Status</th></tr>${DATA.pending.map(p=>`<tr><td>${p.requestId}</td><td>${p.topic}</td><td>${p.status}</td></tr>`).join('')}</table>`}else if(view==='run104'){detail('RUN-104')}else if(view==='run105'){detail('RUN-105')}else{show('overview')}}function detail(id){const r=DATA.runs.find(r=>r.id===id);el.innerHTML=`<h2>Expanded run ${r.id}</h2><p class="banner">SAMPLE DATA · Request ${r.request}${r.topic?' · '+r.topic:''} · no personal information</p><p>Status: ${r.status}. Recorded usage: <strong>${r.units} training units</strong>.</p><table><tr><th>Step</th><th>Result</th><th>Counted units</th></tr>${r.steps.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td></tr>`).join('')}</table><p class="note">Counted units are training assumptions. Output alone does not establish the operations or charge.</p><button data-view="history">Back to Run History</button>`}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)show(b.dataset.view);if(b.dataset.run)detail(b.dataset.run);if(b.id==='counting')document.querySelector('#rules').classList.toggle('hidden');if(b.id==='pause'){paused=true;show('spike')}if(b.id==='reset'){paused=false;show('overview')}});show(new URLSearchParams(location.search).get('view')||'overview');</script></html>
