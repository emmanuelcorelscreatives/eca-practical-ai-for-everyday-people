<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FAQ Review Workspace — Academy teaching prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#183044;font:20px system-ui, sans-serif}.app{max-width:1580px;margin:60px auto;background:white;border:1px solid #ccd8e2;min-height:860px;border-radius:12px;overflow:hidden}header{padding:18px 30px;background:#143c58;color:white;display:flex;justify-content:space-between;gap:20px}small{font-size:15px}nav{padding:10px 30px;background:#f4f7fa;border-bottom:1px solid #ccd8e2;display:flex;gap:12px}select,button{font:18px system-ui;padding:8px;border:1px solid #adc2d2;background:white;border-radius:5px}main{padding:22px 30px}.tag{display:inline-block;background:#e4edf5;color:#174e75;padding:6px 12px;border-radius:5px;font-size:17px;margin-bottom:16px}.warning{background:#fff3d3;padding:18px;border-left:6px solid #c68b10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}section{border:1px solid #c5d5e0;border-radius:8px;padding:22px;margin-bottom:18px}h1{font-size:29px;margin:0 0 18px}h2{font-size:23px;color:#17577f;margin:0 0 15px}p,li{line-height:1.5}table{width:100%;border-collapse:collapse;font-size:18px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #d5e0e8;padding:12px 10px}th{background:#eaf1f7}.source{background:#eef7fc}.draft{background:#fff7e7}.bad{color:#a22c27;text-decoration:line-through}.good{border-left:5px solid #258455}.item{padding:13px;background:#f0f5f9;margin:9px 0}.footer{margin-top:18px;color:#516b7e;font-size:16px}.toolbar{display:flex;gap:15px;margin-top:15px}@media(max-width:800px){body{font-size:17px}.app{margin:10px}.grid{grid-template-columns:1fr}header,nav,main{padding:16px}table{font-size:14px}}@media print{body{background:white}.app{margin:0;border:0}nav,button{display:none}.app{min-height:0}.tag{background:white}section{break-inside:avoid}h2{break-after:avoid}}.workspace-body{display:grid;grid-template-columns:210px 1fr}aside{background:#f3f7fb;border-right:1px solid #d5e0e8;padding:22px 16px;font-size:17px}aside button{display:block;width:100%;border:0;text-align:left;background:transparent;margin:14px 0;font-size:17px}main{min-width:0}section{padding:18px}p{margin:12px 0}.compactfaq section{padding:10px;margin-bottom:10px}.compactfaq h2{font-size:20px;margin-bottom:8px}.compactfaq p{font-size:18px;margin:6px 0}@media(max-width:800px){.workspace-body{display:block}aside{display:none}}@media print{aside{display:none}.workspace-body{display:block}}</style><div class="app"><header><div><b>FAQ Review Workspace</b><br><small>Emmanuel Corels Academy · self-created teaching prototype</small></div><small>Fictional Repair Café · no live account</small></header><nav><label for="view">Training state </label><select id="view"></select><button onclick="window.print()">Print / Save as PDF</button></nav><div class="workspace-body"><aside><b>FAQ Review Workspace</b><button onclick="gotoState('summary')">Overview</button><button onclick="gotoState('bookingdraft')">FAQ Drafts</button><button onclick="gotoState('register')">Sources</button><button onclick="gotoState('decision')">Review Queue</button></aside><main id="main"></main></div></div><script>const DATA={"sources": [{"source_id": "S1", "document": "Event Information Sheet", "owner": "Maya Chen", "approved_date": "14 May 2025", "public_use": "Yes", "facts": "Saturday, 10:00–14:00; Community Hall; Booking is not required. Visitors are helped in arrival order, subject to volunteer availability."}, {"source_id": "S2", "document": "Item Policy", "owner": "Daniel Ortiz", "approved_date": "09 May 2025", "public_use": "Yes", "facts": "Small portable household electrical items may be assessed. Acceptance depends on available volunteers, tools, and safe working conditions."}, {"source_id": "S3", "document": "Volunteer Guide", "owner": "Priya Nair", "approved_date": "06 May 2025", "public_use": "No", "facts": "Internal role guidance. Not an approved public-answer source."}], "questions": [{"id": "Q1", "question": "Do I need to book?", "count": 8}, {"id": "Q2", "question": "What time does it start?", "count": 6}, {"id": "Q3", "question": "Can I bring a toaster?", "count": 5}, {"id": "Q4", "question": "Is there a fee?", "count": 4}, {"id": "Q5", "question": "Can you repair phones?", "count": 3}, {"id": "Q6", "question": "Is parking available?", "count": 2}], "answers": [{"question_id": "Q1", "question": "Do I need to book?", "draft_answer": "No booking is required. Visitors are helped in arrival order, subject to volunteer availability.", "source_id": "S1", "evidence_status": "Supported", "assumption_or_gap": "", "reviewer": "Content coordinator", "decision": "Approved", "escalation_route": ""}, {"question_id": "Q2", "question": "What time does it start?", "draft_answer": "The event is on Saturday, 10:00–14:00, at Community Hall.", "source_id": "S1", "evidence_status": "Supported", "assumption_or_gap": "", "reviewer": "Content coordinator", "decision": "Approved", "escalation_route": ""}, {"question_id": "Q3", "question": "Can I bring a toaster?", "draft_answer": "You may bring a small portable toaster for assessment. Whether volunteers can work on it depends on available skills, tools, and safe working conditions.", "source_id": "S2", "evidence_status": "Supported", "assumption_or_gap": "", "reviewer": "Content coordinator", "decision": "Approved", "escalation_route": ""}, {"question_id": "Q4", "question": "Is there a fee?", "draft_answer": "", "source_id": "", "evidence_status": "Unanswered", "assumption_or_gap": "Whether attendance, assessment, parts, or repairs have a charge.", "reviewer": "Content coordinator", "decision": "Hold", "escalation_route": "Event coordinator; clarify which service or item; awaiting confirmation"}, {"question_id": "Q5", "question": "Can you repair phones?", "draft_answer": "", "source_id": "S2", "evidence_status": "Conflicting", "assumption_or_gap": "Proposed NOT APPROVED update says phones are not accepted. Do not resolve by guessing.", "reviewer": "Content coordinator", "decision": "Hold", "escalation_route": "Workshop coordinator; resolve and approve source policy"}, {"question_id": "Q6", "question": "Is parking available?", "draft_answer": "Parking is available.", "source_id": "", "evidence_status": "Unanswered", "assumption_or_gap": "Unsupported claim; remove and seek approved accessibility/parking information.", "reviewer": "Content coordinator", "decision": "Returned for edit", "escalation_route": "Event coordinator; confirm approved parking/access information"}], "footer": "Can’t find your answer? Contact the event team and include the item type, your question, and any access requirement. A team member will review your request."};const $=id=>document.getElementById(id);const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const card=(t,c,cls='')=>`<section class="${cls}"><h2>${t}</h2>${c}</section>`;const list=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';const tbl=(heads,rows)=>'<table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';const footer=esc(DATA.footer);const s1=esc(DATA.sources[0].facts),s2=esc(DATA.sources[1].facts);const booking=esc(DATA.answers[0].draft_answer),toaster=esc(DATA.answers[2].draft_answer);const source=(id,text)=>card('OPENED SOURCE '+id,'<p>'+text+'</p>','source');const draft=(text)=>card('GENERATED DRAFT','<p>'+text+'</p>','draft');const faq=()=>DATA.answers.filter(x=>x.decision==='Approved').map(x=>card(esc(x.question),'<p>'+esc(x.draft_answer)+'</p>')).join('')+card('Can’t find your answer?',footer);const states={
inbox:()=>card('Repeated questions',tbl(['Question','Count'],DATA.questions.map(x=>[esc(x.question),x.count]))),
questions:()=>states.inbox(),
grouping:()=>card('Do I need to book?',list(['Must I reserve?','Can I just arrive?','Is registration required?']))+card('Keep separate','Can I reserve a repair time? — different information required.'),
workflow:()=>card('FAQ workflow',list(['APPROVED SOURCES','REPEATED QUESTIONS','DRAFT ANSWERS','REVIEW','ESCALATE']))+card('DO NOT GUESS','Unanswered questions keep a visible owner and next action.'),
permission:()=>card('Approved public facts',list(['S1 — Event Information Sheet','S2 — Item Policy']))+card('PRIVATE — DO NOT USE','S3 — Volunteer Guide is internal. The proposed policy update is NOT APPROVED.'),
register:()=>card('Source register',tbl(['Source ID','Document','Owner','Approved date','Public use','Notes'],DATA.sources.map(x=>[x.source_id,esc(x.document),esc(x.owner),x.approved_date,x.public_use,({S1:'Confirmed event details',S2:'Approved public guidance',S3:'Internal procedures'})[x.source_id]]))),
source:()=>states.register()+source('S1',s1),
tracker:()=>card('Blank FAQ tracker',tbl(['Question','Draft answer','Source ID','Evidence status','Assumption or gap','Reviewer','Decision','Escalation route'],[['','','','','','','','']]))+card('Evidence status',list(['Supported','Partial','Unanswered','Conflicting'])),
instruction:()=>'<div class="grid">'+card('APPROVED PUBLIC SOURCES','<h2>S1 — EVENT INFORMATION SHEET</h2><p>'+s1+'</p><h2>S2 — ITEM POLICY</h2><p>'+s2+'</p>')+card('DRAFTING INSTRUCTION',list(['USE ONLY APPROVED SOURCES','ADD THE SUPPORTING SOURCE ID','WRITE UNANSWERED WHEN EVIDENCE IS MISSING','STATE WHAT IS MISSING','DO NOT GUESS']))+'</div>',
voice:()=>card('Voice',list(['Warm, practical, and respectful.','Use plain language. Answer directly in the first sentence.','Avoid promises, technical jargon, promotional claims, and invented exceptions.']))+card('Reviewed example — S1',booking),
bookingdraft:()=>draft('No. You can arrive during the event without booking.')+card('Tracker',tbl(['Question','Source ID','Evidence status'],[['Do I need to book?','S1','Supported — generated draft; not reviewed']])) ,
bookingcompare:()=>'<div class="grid">'+source('S1',s1)+draft('No. You can arrive during the event without booking.')+'</div>'+card('Missing condition','<mark>subject to volunteer availability</mark>'),
bookingcorrected:()=>card('Corrected draft — S1',booking,'good')+card('Review','Evidence status: Supported<br>Reviewer: —<br>Decision: Pending'),
toasterdraft:()=>'<div class="grid">'+source('S2',s2)+draft('<span class="bad">Yes, we repair toasters.</span>')+'</div>'+card('Review issue','Unsupported certainty: assessment is possible; repair is not guaranteed.'),
toastercorrected:()=>card('Revised toaster answer — S2',toaster+'<p>Evidence status: Supported</p>','good')+card('Previous inaccurate draft','<span class="bad">Yes, we repair toasters.</span>'),
fees:()=>card('Is there a fee?','<h2>UNANSWERED</h2><p>Missing information: whether attendance, assessment, parts, or repairs have a charge.</p><p>Source ID: —</p>','warning'),
escalation:()=>card('Escalation record',tbl(['Field','Recorded value'],[['Question','Is there a fee?'],['What is missing','Approved charging policy'],['Assigned owner','Event coordinator'],['Clarification needed from requester','Which service or item?'],['Response channel','Existing approved event-team channel'],['Status','Awaiting confirmation']])),
routes:()=>card('Escalation routes',list(['NEEDS CLARIFICATION — ask requester which item','NEEDS OWNER DECISION — charging policy absent','OUT OF SCOPE — refer to appropriate local service']))+card('Publication rule','Do not publish an unanswered draft as fact.'),
conflict:()=>card('Can you repair phones?','<div class="grid">'+source('S2','Small portable electrical items may be assessed.')+card('Proposed update — NOT APPROVED','Phones are not accepted.','warning')+'</div><p>Status: CONFLICTING</p><p>Public answer: —</p>'),
checklist:()=>card('Human review checklist',list(['Answers the actual question','Supported by opened source','Conditions preserved','Names, dates, times, and locations match','No private information','Voice is consistent','Gap or conflict is visible','Escalation owner is named']))+card('Review record','Reviewer: —<br>Decision: —'),
time:()=>'<div class="grid">'+source('S1','<mark>Saturday, 10:00–14:00</mark><p>Community Hall</p>')+card('FAQ answer','<mark>Saturday, 10:00–14:00</mark><p>Community Hall</p>')+'</div>'+card('Review record','Reviewer: Content coordinator (fictional role)<br>Time matches source.'),
updated:()=>card('SOURCE UPDATED — RE-REVIEW 3 ANSWERS',tbl(['Question','Source ID','Approval'],[['Do I need to book?','S1','Pending'],['What time does it start?','S1','Pending'],['Where is the event?','S1','Pending']])),
decision:()=>card('Review decision','<div class="toolbar"><button data-choice="APPROVE" onclick="decide(this.dataset.choice)">APPROVE</button><button data-choice="RETURN FOR EDIT" onclick="decide(this.dataset.choice)">RETURN FOR EDIT</button><button data-choice="HOLD — INFORMATION MISSING" onclick="decide(this.dataset.choice)">HOLD — INFORMATION MISSING</button></div><p id="decision">Selected: RETURN FOR EDIT</p><p>Restore volunteer-availability condition.</p><p>No publishing action occurs here.</p>'),
faq:()=>'<span class="tag">REVIEWED VERSION · fictional training example</span>'+faq(),
footer:()=>card('Public escalation route',footer),
layout:()=>'<div class="grid">'+card('Desktop preview',faq())+'<section style="max-width:420px"><h2>Phone preview</h2>'+faq()+'</section></div>',
export:()=>'<div class="grid">'+card('Approved document','<p><mark>Saturday, 10:00–14:00</mark></p><p>'+booking+'</p><p>'+footer+'</p>')+card('Export inspection','Use Print / Save as PDF above. Open the actual saved file and compare dates, conditions, headings and footer. No exported file is claimed by this training state.')+'</div>',
fallback:()=>card('NO INTEGRATED AI REQUIRED',list(['Approved Sources','Question List','FAQ Tracker — spreadsheet / CSV','Reviewed FAQ — plain document','Escalation Log'])),
summary:()=>card('Final review summary',tbl(['Questions total','Approved','Returned for edit','Unanswered','Conflict'],[['6','3','1','1','1']]))+card('Publication rule','Only Approved answers enter the public FAQ.'),
package:()=>card('Completed fictional FAQ package',list(['Source register','Reviewed FAQ — three approved answers','Question tracker — all six questions retained','Reviewer decisions','Escalation log — unresolved cases remain separate'])),
next:()=>card('Next lesson — Repurpose Approved Content',list(['One approved announcement','Email — blank destination','Social — blank destination','Poster — blank destination'])),
reminder:()=>card('SOURCE · REVIEW · ESCALATE','<div class="grid">'+source('S1',s1)+card('Reviewed FAQ',booking)+'</div>')};
states.faqinternal=()=>'<div class="grid">'+card('Internal reviewed copy',tbl(['Question','Source ID','Decision'],DATA.answers.filter(a=>a.decision==='Approved').map(a=>[esc(a.question),a.source_id,'Approved'])))+'<div class="compactfaq">'+card('REVIEWED VERSION — public preview',faq())+'</div></div>';states.layout=()=>'<div class="grid"><div class="compactfaq">'+card('Desktop page',faq())+'</div><div class="compactfaq" style="max-width:400px">'+card('Phone-sized page',faq())+'</div></div>';states.export=()=>'<div class="grid"><div class="compactfaq">'+card('Approved FAQ document',faq())+'</div>'+card('Actual exported PDF preview','<img src="reviewed-faq-export.png" alt="Actual rasterized one-page exported FAQ PDF" style="display:block;width:100%;max-height:760px;object-fit:contain"><small>Actual file: reviewed-faq-export.pdf</small>')+'</div>';function gotoState(v){$("view").value=v;show()}states.questionreview=()=>card('Repeated questions — grouped for review',tbl(['Question','Review note'],[['Do I need to book?','Booking variants grouped'],['Can I bring a toaster?','Preserve assessment conditions'],['Is there a fee?','Needs an answer']]))+card('Needs an answer','—');states.materials=()=>card('Permission-cleared practice materials',list(['Event Information Sheet — S1','Volunteer Guide — S3 (internal only)','Item Policy — S2','Blank FAQ Tracker']))+card('FICTIONAL PRACTICE MATERIAL','Self-authored example; no real inbox or personal details.');states.triage=()=>card('Source triage',tbl(['APPROVED','NEEDS CONFIRMATION','PRIVATE — DO NOT USE'],[['S1 Event Information Sheet<br>S2 Item Policy','Proposed phones update — NOT APPROVED','S3 Volunteer Guide']])) ;states.processchecklist=()=>card('FAQ completion checklist',list(['Collect approved sources','Group repeated questions','Draft without guessing','Check against opened evidence','Review','Escalate gaps','Inspect final file']));states.helpdesk=()=>'<div class="grid"><div class="compactfaq">'+card('Reviewed FAQ — public answers',faq())+'</div>'+card('Unanswered request — follow-up','Question: Is there a fee?<br>Missing: Approved charging policy<br>Owner: Event coordinator<br>Status: Awaiting confirmation')+'</div>';const names=Object.keys(states);for(const n of names){const o=document.createElement('option');o.value=n;o.textContent=n;$('view').append(o)}function show(){const n=$('view').value;$('main').innerHTML='<span class="tag">FICTIONAL PRACTICE MATERIAL · saved training state</span>'+states[n]()+'<p class="footer">Local teaching prototype · no real event, account, AI request or external action</p>';history.replaceState(null,'','#'+n)}function decide(v){$('decision').textContent='Selected: '+v+' — local exercise only'}$('view').onchange=show;$('view').value=states[location.hash.slice(1)]?location.hash.slice(1):'register';show();</script></html>
