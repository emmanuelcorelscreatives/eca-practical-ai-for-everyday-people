<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decision Criteria Worksheet version 1.0</title><style>*{box-sizing:border-box}body{font:20px Arial,sans-serif;margin:0;background:#f1f5f9;color:#142337}main{max-width:1530px;margin:38px auto;padding:26px 36px;background:white;border:1px solid #ccd6e0;border-radius:12px}h1{font-size:31px;margin:0 0 8px}h2{font-size:27px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}button{font:inherit;font-size:15px;border:1px solid #a9b8ca;border-radius:5px;padding:9px;background:#fff;color:#142337;cursor:pointer}button.active{background:#153c64;color:#fff}.banner{padding:12px;border-left:5px solid #d39919;background:#fff6d7;margin:16px 0}.card{padding:19px;background:#f6f9fc;border:1px solid #c9d7e4;border-radius:8px;margin:12px 0}li{margin:13px 0;line-height:1.4}p{line-height:1.45}table{width:100%;border-collapse:collapse;font-size:16px}th,td{border:1px solid #b9c8d8;padding:12px;text-align:left;vertical-align:top}th{background:#e8eff7}small{font-size:15px;color:#485b72}.unknown{color:#616b79}.accept{color:#19623d;font-weight:bold}section{min-height:440px}textarea{font:18px Arial;width:100%;height:250px;padding:16px}footer{border-top:1px solid #c9d7e4;padding-top:14px;margin-top:24px;font-size:16px}@media print{nav,.print{display:none}main{border:0;margin:0}body{background:white}}</style><main><h1>Decision Criteria Worksheet <small>version 1.0</small></h1><small>Emmanuel Corels Academy • Fictional workshop exercise • No venue evidence collected</small><nav aria-label="Teaching states"></nav><section id="view"></section><footer>Harbor Room · Cedar Hall · Junction Studio — fictional options; no venue ranked or selected. <button class="print" onclick="window.print()">Print current view</button></footer></main><script>const d={"rows": [["Total cost", "Keep the same booking affordable", "All required venue charges for the same three-hour booking, including mandatory equipment, fees and applicable taxes; exclude unrequested optional extras", "State one currency before collecting amounts", "Opened itemised quotation for the same booking", "Unknown"], ["Travel time", "Know the duration of the journey", "Typical one-way journey from Central Library entrance using the same transport mode and comparable departure period", "Minutes; record the chosen mode and period", "Opened current journey information, origin and method recorded", "Unknown"], ["Accessibility beyond minimum", "Support attendees beyond the required route", "Confirmed relevant features beyond the step-free route to the workshop room: hearing support, accessible toilet, suitable seating space and access to all required areas", "Record each confirmed feature separately; do not score the word accessible", "Opened feature details or explicit venue confirmation", "Unknown"], ["Room suitability", "Fit the planned workshop activity", "Confirmed seating layout, presentation space and activity space", "Before assessment, agree explicit requirements for seating layout, presentation space and planned activity space. Meets: all three requirements confirmed met. Partly meets: one or two confirmed met and the others confirmed not met. Does not meet: all three confirmed not met. Unknown: any requirement or its evidence is missing. Never override a failed pass-or-stop constraint.", "Opened layout information and activity requirements", "Unknown"], ["Cancellation flexibility", "Understand consequences if plans change", "Booking change or cancellation conditions", "Record deadline, fee, refund condition and exceptions separately", "Opened applicable booking policy", "Unknown"], ["Public transport practicality", "Check whether arrival is practical", "Service frequency and final walking route during the agreed arrival period", "Frequency and route details; keep separate from travel duration", "Opened current journey information", "Unknown"]], "headers": ["Criterion", "Why it matters", "Definition", "Unit or rating rule", "Evidence needed", "Missing-value treatment"], "constraints": ["Available on the event date", "Legally permitted capacity of at least 40 people", "Step-free route to the workshop room"], "prompt": "Review these draft criteria for ambiguity, overlap, missing considerations, and inconsistent measurement. Do not rank the venues, assign scores or weights, invent evidence, or decide my priorities. Return suggestions separately from accepted criteria."};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const li=a=>'<ul>'+a.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';const card=(t,s)=>'<div class="card"><h2>'+esc(t)+'</h2>'+s+'</div>';const tab=(rs,hs=d.headers)=>'<table><thead><tr>'+hs.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const states={
'Constraints':()=>'<h2>Decision</h2><p>Choose a suitable venue for a three-hour community workshop.</p>'+card('Pass-or-stop constraints',li(d.constraints))+'<p>Confirm every constraint from opened evidence; mark unconfirmed facts as unknown.</p>',
'Draft':()=>'<h2>Criteria Draft</h2><div class="banner">Draft criteria only — no option has been assessed.</div>'+li(d.rows.slice(0,5).map(r=>r[0])),
'Cost':()=>card('Total cost','<p>Meaning: all required venue charges for the same three-hour booking</p><p>Unit: local currency (choose and state one)</p><p>Include: mandatory equipment, fees and taxes when applicable</p><p>Exclude: optional extras not requested</p>'),
'Travel':()=>card('Travel time','<p>Meaning: typical one-way journey from Central Library entrance</p><p>Unit: minutes</p><p>Method: same transport mode and comparable departure period</p><p>Missing information: unknown</p><p>◉ Central Library entrance</p>'),
'Accessibility':()=>card('Accessibility beyond minimum','<p>Confirmed features relevant to attendees, recorded individually</p>'+li(['Hearing support','Accessible toilet','Suitable seating space','Step-free access to all required areas beyond the minimum room route'])+'<p>Do not convert the word accessible into an unsupported score.</p>'),
'Room':()=>card('Room suitability', '<p>'+esc(d.rows[3][3])+'</p><div class="banner">Agree the seating, presentation and activity requirements first. No venue evidence is supplied: every option remains Unknown.</div>'),
'Cancellation':()=>card('Cancellation flexibility','<p>Meaning: conditions for changing or cancelling the booking</p><p>Evidence to capture: deadline, fee, refund condition, exceptions</p><p>Missing details: unknown</p>'),
'Definitions':()=>'<h2>Criteria Definition</h2>'+tab(d.rows.slice(0,5)),
'Prompt':()=>card('Prompt Review','<p>'+esc(d.prompt)+'</p>'),
'Suggestions':()=>'<h2>AI Review — scripted course example</h2><div class="banner">GENERATED SUGGESTIONS — NOT ACCEPTED CRITERIA</div>'+li(['Clarify whether total cost includes required equipment','Check possible overlap between step-free access and accessibility features','Consider whether room availability should remain a constraint'])+'<small>This saved teaching example is not a live model response or venue evidence.</small>',
'Overlap':()=>card('Overlap review','<p>Minimum constraint → step-free route to the workshop room</p><p>Distinct comparative criterion → confirmed accessibility features beyond the minimum route requirement</p>'),
'Considerations':()=>card('Missing Consideration review','<p>Generated suggestion: environmental impact</p><p class="accept">Accepted by decision maker: Public transport practicality</p><p>Rejected: environmental impact — outside this decision’s agreed scope</p><p>Manual decisions in this fictional exercise; no automatic acceptance.</p>'),
'Practicality':()=>card('Public transport practicality','<p class="accept">Accepted by decision maker</p><p>Definition: service frequency and walking route for the agreed arrival period</p><p>Evidence needed: current journey information opened and checked</p><p>Missing-value treatment: unknown</p>'),
'Duplication':()=>'<h2>Duplication check</h2>'+tab([['Total cost / Cancellation flexibility','Booking amount / changed-plan conditions','Amount for same booking / deadline, fee, refund, exceptions'],['Travel time / Public transport practicality','Journey duration / practical arrival','One-way minutes / service frequency and walking route'],['Minimum accessibility / Beyond-minimum features','Room eligibility / additional support','Step-free room route / confirmed additional features']],['Criterion pair','Distinct consequence?','Boundary clear?']),
'Common basis':()=>'<h2>Common Basis</h2>'+li(['✓ Same booking duration','✓ Same starting point','✓ Same transport mode','✓ Same arrival period','✓ Same required room activities','✓ Same evidence standard','☐ Option values collected'])+'<small>Checks indicate matching measurement rules, not collected venue evidence. Agree unspecified planning inputs before research.</small>',
'Evidence preview':()=>'<h2>Empty Evidence Preview</h2><div class="banner">Never replace missing evidence with an AI estimate.</div>'+tab(d.rows.map(r=>[r[0],'Unknown','Unknown','Unknown']),['Criterion','Harbor Room','Cedar Hall','Junction Studio']),
'Readiness':()=>'<h2>Criteria Readiness</h2><p>Checklist of definition rules, not proof of venue eligibility. Before real assessment, agree event date, currency, transport mode, period and the three room requirements. All venue results remain Unknown.</p>'+li(['✓ Applies to every remaining option','✓ Has one clear meaning','✓ Has a unit or defined rating rule','✓ Points to inspectable evidence','✓ Distinguishes options','✓ Does not duplicate another criterion','✓ States how unknowns are handled']),
'Manual':()=>'<h2>Manual worksheet</h2>'+card('Decision','<p>Choose a suitable venue for a three-hour community workshop.</p>')+card('Nonnegotiable constraints',li(d.constraints))+tab([['','','','','']],['Criteria','Meaning','Unit or rule','Evidence needed','Unknown treatment']),
'Final':()=>'<h2>Completed criteria definitions</h2>'+tab(d.rows)+'<div class="banner">Criteria ready as rules; agree planning inputs before assessment. Option evidence not yet entered.</div><p>Priorities remain with the decision maker.</p>',
'Practice':()=>'<h2>Your practice draft</h2><p>Write your decision, constraints, criteria definitions, unknown treatment and suggestion decisions below. Edits survive tab changes in this page only. Copy or print before reload or closing; nothing is saved persistently.</p><textarea aria-label="Your practice draft" placeholder="Decision:&#10;Constraints:&#10;Criterion | Meaning | Unit or rule | Evidence | Unknown treatment"></textarea>'
};let practiceDraft='';function show(n){const previous=document.querySelector('textarea');if(previous)practiceDraft=previous.value;document.querySelector('#view').innerHTML=states[n]();const current=document.querySelector('textarea');if(current){current.value=practiceDraft;current.addEventListener('input',()=>{practiceDraft=current.value})}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent===n));location.hash=encodeURIComponent(n)}const nav=document.querySelector('nav');Object.keys(states).forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>show(n);nav.append(b)});let n=decodeURIComponent(location.hash.slice(1));show(n in states?n:'Constraints');</script></html>
