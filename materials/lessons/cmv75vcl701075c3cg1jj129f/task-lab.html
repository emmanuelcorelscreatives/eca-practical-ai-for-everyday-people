<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Lab — Academy training</title><style>body{margin:0;background:#f2f5fa;color:#182438;font:18px system-ui}header,main{max-width:1280px;margin:auto;padding:24px}header{background:white}h1{margin:0}small{display:block;margin:10px 0;color:#42506b}button,select{font:inherit;padding:12px;margin:4px;border:1px solid #b8c6da;background:white;border-radius:6px;cursor:pointer}button:disabled{opacity:.5;cursor:default}.active{background:#183b70;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #d4dce7;padding:22px;border-radius:8px;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:17px/1.6 system-ui}li{margin:9px 0}.missing{color:#8c310d}.tag{font-weight:bold;color:#174f42}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #dde3ed;text-align:left}@media(max-width:800px){.grid{display:block}}</style><header><h1>Task Lab</h1><small>Self-created Academy practice app • Fictional Riverlight documents • No external actions</small><nav><button data-tab="chat">Chat</button><button data-tab="fixed">Fixed workflow</button><button data-tab="tools">Tool-using simulator</button><button data-tab="inspect">Input inspection</button></nav></header><main><label>Practice case <select id="case"><option value="standard">Standard brief</option><option value="confirmed">Confirmed totals</option><option value="missing">Missing table count</option></select></label><section class="grid"><article class="card"><h2>Approved event documents</h2><div id="source"></div></article><article class="card"><h2 id="heading"></h2><div id="content"></div></article></section><section class="card"><h2>Actual local execution record</h2><small>Only actions executed in this browser are recorded below. No live AI model is connected.</small><table><thead><tr><th>Action</th><th>Input sent</th><th>Output returned</th></tr></thead><tbody id="log"></tbody></table><button id="reset">Reset local run</button></section></main><script>
'use strict';
const base={event:'Riverlight Community Reading Day',date:'12 June 2027',time:'10:00–13:00',venue:'Cedar Community Hall',attendees:48,tables:6,seats:8,jugs:2,projector:'available',contact:null};
let mode='chat',step=0,records=[],observed=null,calculated=null;
const $=id=>document.getElementById(id);function data(){let d={...base};if($('case').value==='missing')d.tables=null;if($('case').value==='confirmed'){d.confirmedSeats=48;d.confirmedJugs=12}return d}
function text(tag,s,parent){let e=document.createElement(tag);e.textContent=s;parent.append(e);return e}
function row(action,input,output){records.push({action,input,output});let r=document.createElement('tr');[action,input,output].forEach(s=>text('td',s,r));$('log').append(r)}
function clear(){step=0;records=[];observed=null;calculated=null;$('log').replaceChildren();render()}
function search(){observed=data();row('Read-only approved-document search','Find event identity, schedule, venue, attendance, setup quantities, equipment and missing fields.','Page 1: '+observed.event+'; '+observed.date+'; '+observed.time+'; '+observed.venue+'; '+observed.attendees+' attendees. Page 2: '+(observed.tables===null?'Table count not supplied':observed.tables+' tables')+'; '+observed.seats+' seats/table; '+observed.jugs+' jugs/table; projector available; accessibility contact not supplied.'+(observed.confirmedSeats?' Supplied confirmed totals: 48 seats; 12 water jugs.':''));return observed}
function multiply(a,b){if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||a<1||b<1||a>10000||b>10000)throw Error('Positive whole numbers from 1 to 10000 required');return a*b}
function calculate(d){if(d.tables===null){row('Validation stop','Table count not supplied','Cannot calculate seating or water totals. Request table count.');return null}let x={seats:multiply(d.tables,d.seats),jugs:multiply(d.tables,d.jugs)};row('Arithmetic-only calculator',`${d.tables} × ${d.seats}; ${d.tables} × ${d.jugs}`,`${x.seats} seats; ${x.jugs} water jugs`);return x}
function button(label,fn,parent){let b=text('button',label,parent);b.onclick=fn;return b}
function draft(d,c,parent,fixture=false){text('h3','Proposed checklist ready for review',parent);text('p',(fixture?'Supplied response fixture — source facts: ':'Opened evidence: ')+[d.event,d.date,d.time,d.venue,d.attendees+' expected attendees',(d.tables===null?'Table count not supplied':d.tables+' tables'),d.seats+' seats per table',d.jugs+' water jugs per table','Projector '+d.projector].join(' • '),parent);text('p',(fixture?'Supplied response fixture — quantity values: ':d.confirmedSeats?'Opened confirmed totals: ':'Calculated values: ')+(c?`${c.seats} seats; ${c.jugs} water jugs`:'Not established'),parent);text('p','Generated suggestion fixture: welcome sign, name badges, refreshment station. Not supplied requirements.',parent);text('p','Missing information: Accessibility contact not supplied'+(d.tables===null?'; table count not supplied':''),parent).className='missing';text('p','No message, purchase, booking or publication has occurred.',parent);['Accept draft','Return for correction','Use manual checklist'].forEach(label=>button(label,()=>{row('Human local review',label,'Local decision recorded; no external action.');text('p',label+' — local decision only',parent)},parent))}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.className=b.dataset.tab===mode?'active':'');let d=data(),s=$('source');s.replaceChildren();text('h3','Source page 1',s);text('p',[d.event,d.date,d.time+' (three hours)',d.venue,d.attendees+' expected attendees'].join(' • '),s);text('h3','Source page 2',s);text('p',(d.tables===null?'Table count: not supplied':d.tables+' tables')+`; ${d.seats} seats per table; ${d.jugs} water jugs per table; Projector available; Accessibility contact: not supplied.`,s);if(d.confirmedSeats)text('p','48 seats confirmed; 12 water jugs confirmed.',s);let c=$('content');c.replaceChildren();$('heading').textContent={chat:'Chat reference fixture',fixed:'Fixed workflow',tools:'Tool-using simulator',inspect:'Inspect the input'}[mode];
if(mode==='chat'){text('p','Supplied study response — not a live chatbot generation. Request → response; no separate tool action recorded.',c);text('blockquote','Create a setup checklist from the approved Riverlight event brief. Separate supplied facts, suggestions, and missing information.',c);draft(d,d.tables===null?null:{seats:d.confirmedSeats||48,jugs:d.confirmedJugs||12},c,true)}
if(mode==='fixed'){text('p','Predefined route: Receive brief → Extract fields → Calculate supplies → Draft checklist → Human review',c);button('Start workflow',()=>{observed=search();row('Preset field extraction','Approved pages','Missing contact remains empty');calculated=calculate(observed);if(calculated){row('Preset draft creation','Verified source fields and calculator results','Proposal awaiting human review');draft(observed,calculated,c)}else text('p','Validation stop: request the missing table count. No draft totals inferred.',c)},c)}
if(mode==='tools'){text('p','Rule-based teaching simulator, not AI. Its visible rule selects a next action from the observed local result.',c);text('p','Goal: Prepare a checked Riverlight event setup checklist.',c);text('p','Tools: approved event documents (read only); calculator (positive whole-number multiplication only).',c);button('Choose next action',()=>{if(step===0){search();step=1;text('p','Observed approved pages. Inspect the local record below.',c)}else if(step===1){if(observed.tables===null&&!observed.confirmedSeats){row('Stop and request missing information','Table count not supplied','Cannot calculate seating or water totals');text('p','Stopped. Request the table count before calculation.',c);step=3}else if(observed.confirmedSeats){calculated={seats:observed.confirmedSeats,jugs:observed.confirmedJugs};row('Skip calculator','Approved pages supply confirmed totals','48 seats; 12 water jugs');step=2;text('p','Confirmed totals supplied: calculator skipped.',c)}else{calculated=calculate(observed);step=2;text('p','Calculation returned. Inspect both inputs and outputs.',c)}}else if(step===2){row('Create local proposal','Opened evidence and returned totals','Proposed checklist ready for review; contact unresolved');draft(observed,calculated,c);step=3}else text('p','Stopped at human review. Reset to begin another case.',c)},c)}
if(mode==='inspect'){text('p','Separate standard-case hypothetical: seven tables instead of the standard brief’s approved six, regardless of the case selector. This is an explicitly supplied error exercise.',c);button('Calculate hypothetical wrong inputs',()=>{let a=multiply(7,8),b=multiply(7,2);row('Hypothetical arithmetic exercise','7 × 8; 7 × 2',`${a} seats; ${b} jugs — source mismatch, reject`);text('p',`${a} and ${b} are correct arithmetic with incorrect source inputs. Approved table count: 6.`,c)},c)}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{mode=b.dataset.tab;clear()});$('case').onchange=clear;$('reset').onclick=clear;render();
</script></html>
