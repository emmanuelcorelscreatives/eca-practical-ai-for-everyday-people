<!doctype html><html lang="en"><meta charset="utf-8"><title>Academy Riverside practice workspace</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#183048;font:25px/1.35 Arial,sans-serif}header{padding:22px 160px;background:#183048;color:white;font-size:23px}header small{display:block;color:#cce0f0}main{margin:20px 170px;max-width:1580px}h1{font-size:39px;margin:18px 0}h2{font-size:28px;margin:10px 0}p{margin:12px 0}section,.card{padding:24px 28px;border:1px solid #a9bfd0;border-radius:12px;background:white;margin:16px 0}aside{background:#fff0c7;padding:16px 22px;border-radius:8px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #9daebf;border-radius:6px}input[type=checkbox]{width:25px;height:25px}textarea{width:100%;height:330px;line-height:1.6;resize:none}button{color:white;background:#1e567a;cursor:pointer}a{color:#155a87}nav{display:flex;gap:20px;font-size:18px;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}table{width:100%;border-collapse:collapse;font-size:23px}td,th{border:1px solid #bacbd7;padding:13px;text-align:left}th{background:#e4edf5}.badge{color:#78510a;font-weight:bold}.good{color:#1a5a43;font-weight:bold}label{display:block;margin:14px 0}.small{font-size:21px}.muted{color:#4f6576}</style><header>Academy Riverside practice workspace<small>Fictional demonstration · original case plus labeled classroom extension · no live services or transactions</small></header><nav id="all-views" style="padding:8px 0;flex-wrap:wrap;margin:0 170px;gap:6px 20px"><a href="?view=prompt">Research</a><a href="?view=result">Suggestions</a><a href="?view=venue-a">Venue A</a><a href="?view=hours">Weekly/special hours</a><a href="?view=mapcompare">Listing comparison</a><a href="?view=venue-b">Venue B</a><a href="?view=venue-c">Venue C contact</a><a href="?view=operator">Journey planner</a><a href="?view=alerts">Route 1 alert</a><a href="?view=operating">Route 2 rehearsal</a><a href="?view=retailcompare">Retail evidence</a></nav><main id="main"></main><script>
const DATE='Saturday 17 October 2026',fixed='Riverside · '+DATE+' · local time',prompt='Plan a fictional Saturday outing in Riverside for 17 October 2026.\n• Total budget limit: learner-defined modest budget\n• Step-free route and entrances\n• Vegetarian lunch\n• Depart after 10:00; return by 18:00\n\nSuggest one primary plan, two venue alternatives and one alternate transport route. Label assumptions, unknowns and facts requiring a current check.';
const row=(a,b)=>'<tr><th>'+a+'</th><td>'+b+'</td></tr>',table=rows=>'<table>'+rows.map(x=>row(...x)).join('')+'</table>',unknown='<span class="badge">Not supplied — confirm before use</span>',heading=t=>'<h1>'+t+'</h1><p>'+fixed+'</p>',nav='<nav><a href="?view=prompt">Research</a><a href="?view=venue-a">Venue A</a><a href="?view=venue-b">Venue B</a><a href="?view=venue-c">Venue C</a><a href="?view=operator">Transport</a></nav>';
const views={prompt:()=>heading('Draft the fictional outing request')+'<section><label for="request">Practice assistant prompt</label><textarea id="request"></textarea><button id="suggest">Generate practice suggestions</button><p class="small">Scripted training output only. No request is sent to an external assistant.</p></section>',result:()=>heading('Generated suggestions — not yet verified')+table([['Primary plan','Venue A — opening status, price and access require date-specific checks'],['Alternative 1','Venue B — nearby does not prove suitability'],['Alternative 2','Venue C — step-free access: confirmation required'],['Alternate transport','Route 2 — refresh operator status and return journey'],['Assumptions','Suggested options are candidates, not availability confirmations'],['Unknowns','Exact budget, costs, times and reservations require opened evidence']]),'venue-a':()=>heading('Venue A · visit information')+nav+'<section>'+table([['Outing date',DATE],['Special hours for 17 October 2026','Closed — fictional 09:30 rehearsal update'],['Entrance accessibility',unknown],['Reservation status',unknown],['Admission price',unknown]])+'</section><aside>Classroom closure record E-A. No actual venue identity or opening hours are asserted.</aside>',hours:()=>heading('Venue A · normal and special hours')+nav+'<section><h2>Normal weekly hours</h2><p>Monday–Sunday 10:00–17:00 · author-created classroom timetable</p></section><section><h2>Special hours for 17 October 2026</h2><p class="badge">Closed · confirmed in the fictional 09:30 rehearsal</p></section>',mapcompare:()=>heading('Normal listing versus date-specific venue evidence')+'<section><h2>Fictional public map listing · Venue A</h2><p>Normal hours listing — date-specific status not established</p></section><section><h2>Fictional official Venue A page</h2><p>Special hours for 17 October 2026: <strong>Closed</strong></p><p>Rehearsal update: 09:30 local · E-A</p></section>','venue-b':()=>heading('Venue B · date-specific checks')+nav+'<section>'+table([['Opening status for '+DATE,'Open in the narrated completed fictional example'],['Access','Step-free main entrance'],['Food','<a href="?view=menu">Vegetarian menu</a>'],['Reservation requirement','Reservation required — this unreserved app is a check exercise, not a committed booking'],['Budget and return journey','Narrated completed example: all required suitability checks passed. This unreserved app does not prove booking completion; satisfy required reservation conditions before any real switch.']])+'</section>',menu:()=>heading('Venue B · vegetarian menu information')+'<section><p>Vegetarian food suitability checked in the completed fictional example.</p><p>Specific dishes, prices and allergy details are not supplied. Confirm these for a real outing.</p><a href="?view=venue-b">Back to Venue B</a></section>','venue-c':()=>heading('Venue C · access clarification')+nav+'<section><h2>Step-free access: confirmation required</h2><p>Do not use unless step-free access is confirmed.</p><p>Public telephone line: 01632 960123 · reserved fictitious example, do not call.</p><label for="question">Contact form · draft only</label><textarea style="height:150px" id="question" placeholder="Ask about the exact date, entrance access and reservation requirement"></textarea><button id="draft">Keep unsent draft in this tab</button><p id="draft-state">No message sent · no personal data</p></section>',operator:()=>heading('Fictional transport operator · journey planner')+nav+'<section><label>Journey date <input id="date" type="date" value="2026-10-17"></label><label>Depart after <input id="after" type="time" value="10:00"></label><label><input id="stepfree" type="checkbox" checked> Step-free route and entrances</label><p>Planned service: <strong>Route 1</strong></p><p>Return constraint: by 18:00</p><p id="planner-status">Supported classroom inputs: 17 October 2026, after 10:00, step-free selected.</p><button id="route-check">Open supported scenario service alerts</button></section>',alerts:()=>heading('Fictional operator · service alerts')+nav+'<section>'+table([['Affected route','Route 1 — planned interruption'],['Alternative','Route 2 — check refreshed operating status'],['Affected stop','Riverside Museum stop · fictional'],['Affected time range','10:00–12:00 local · 17 October 2026 · fictional'],['Evidence status','Fictional rehearsal record E-R1, not a live operator notice']])+'</section><aside>Do not infer a departure, duration, accessible stop or arrival time from missing values.</aside>',retailcompare:()=>heading('Generated suggestion versus opened retailer evidence')+'<section><h2>Generated</h2><p>“available nearby” — location and exact variant not verified</p></section><section><h2>Opened evidence · fictional retailer check</h2>'+table([['Exact branch','Bristol Harbourside practice branch'],['Exact variant and quantity','Ridgeview 22L Daypack · Olive Green · quantity 1'],['Stock status','In stock · author-created fictional fixture only'],['Mandatory charges and total','GBP64.00 + GBP0.00 collection = GBP64.00 total']])+'</section><aside>New self-authored fictional retail evidence extension · not live stock or price · no checkout or transaction available.</aside>',operating:()=>heading('Fictional operator · rehearsal update')+'<section>'+table([['Route 1','Interrupted'],['Route 2','Operating in this fictional rehearsal'],['Date',DATE],['Evidence','E-R1 / E-R2 · classroom scenario, not live transport'],['Remaining checks','Step-free route, extra time, total cost and return by 18:00 require refreshed evidence']])+'</section><section><h2>Comparison sheet · separate reference</h2>'+table([['Venue B','Usable in the completed teaching example'],['Route 2','Alternate route; operating status refreshed'],['Venue C','Unresolved — step-free access confirmation required']])+'</section>'};
const view=new URLSearchParams(location.search).get('view')||'prompt';document.getElementById('main').innerHTML=(views[view]||views.prompt)();if(document.getElementById('request'))document.getElementById('request').value=prompt;document.getElementById('suggest')?.addEventListener('click',()=>{location.search='?view=result'});document.getElementById('route-check')?.addEventListener('click',()=>{if(document.getElementById('date').value!=='2026-10-17'||document.getElementById('after').value!=='10:00'||!document.getElementById('stepfree').checked){document.getElementById('planner-status').textContent='Unsupported practice inputs — only 17 October 2026 after 10:00 with step-free selected has supplied fictional evidence. No result checked.';return;}location.search='?view=alerts'});if(document.getElementById('question'))document.getElementById('question').value=sessionStorage.getItem('academy-riverside-question')||'';document.getElementById('draft')?.addEventListener('click',()=>{sessionStorage.setItem('academy-riverside-question',document.getElementById('question').value);document.getElementById('draft-state').textContent='Unsent draft retained for this tab session · navigate back to retrieve it · no message sent'});window.academyRiverside={view,date:DATE,fictional:true,liveRequests:0,transactionControls:0};
</script></html>
