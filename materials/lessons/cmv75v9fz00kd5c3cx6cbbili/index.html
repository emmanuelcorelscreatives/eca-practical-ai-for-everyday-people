<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Academy household planner</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#17283b;font:26px Arial,sans-serif}header{padding:20px 45px;background:#fff;border-bottom:1px solid #bccbd6}header strong{font-size:30px}header small{display:block;color:#56677a;font-size:19px;margin-top:8px}nav{padding:12px 40px;background:#e2e9ef;display:flex;gap:9px;flex-wrap:wrap}button,input,textarea{font:inherit}nav button{font-size:17px;padding:9px 13px;border:1px solid #aabac8;background:#fff;border-radius:7px}button{cursor:pointer;padding:13px 22px;background:#126a82;color:#fff;border:0;border-radius:7px}main{padding:22px 50px}h1{font-size:40px;margin:8px 0 20px}h2{font-size:29px;margin:8px 0 17px}p{line-height:1.4}table{border-collapse:collapse;width:100%;font-size:24px;background:#fff}th,td{text-align:left;padding:13px 17px;border-bottom:1px solid #d6e0e7}th{background:#dce7ec}td small{font-size:19px}section,.card{background:#fff;padding:24px;border:1px solid #c6d4df;border-radius:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}.three{grid-template-columns:1fr 1fr 1fr}.pill{background:#e2edf2;padding:7px 13px;border-radius:6px;font-size:22px}.amber{background:#fff0cc}.red{background:#ffe2dd}.green{background:#e0f2e7}.muted{color:#526477}li{margin:13px 0;line-height:1.35}textarea{width:100%;height:155px;padding:14px;border:1px solid #aebfcd;font-size:24px}label{display:block;margin:18px 0}input[type=text]{font-size:24px;padding:9px;width:60%}.steps{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.steps b{padding:23px;background:#e4edf2;border-radius:9px}#status{padding:12px 18px;background:#eef6fa;margin:15px 0;min-height:48px}</style><header><button id="toggle-editor" style="float:right;font-size:18px" onclick="document.getElementById('main').contentEditable=document.getElementById('main').isContentEditable?'false':'true'">Edit document locally</button><strong>Academy household planner</strong><small>Self-authored fictional practice · scripted draft, not live AI output · no connected actions</small></header><nav id="nav"></nav><main id="main"></main><script>
const DATA={"original": [{"day": "Monday", "start": "17:35", "end": "18:10", "action": "Chickpea carrot spinach rice", "status": "draft", "check": "active time requires confirmation"}, {"day": "Monday", "start": "18:15", "end": "18:20", "action": "Start laundry", "status": "draft", "check": "machine duration and drying/put-away unresolved"}, {"day": "Tuesday", "start": "17:30", "end": "18:10", "action": "Vegetable tray bake", "status": "faulty draft", "check": "conflicts with required departure"}, {"day": "Tuesday", "start": "17:40", "end": "18:00", "action": "Outbound travel", "status": "fixed", "check": "school event"}, {"day": "Tuesday", "start": "18:00", "end": "19:30", "action": "School event", "status": "fixed", "check": "preserve"}, {"day": "Tuesday", "start": "19:30", "end": "19:50", "action": "Return travel", "status": "fixed", "check": "preserve"}, {"day": "Tuesday", "start": "20:05", "end": "20:10", "action": "Put recycling outside", "status": "provisional", "check": "proposed placement before Wednesday08:00; confirm responsible adult and access"}, {"day": "Wednesday", "start": "", "end": "", "action": "Leftovers before birthday tea", "status": "provisional unscheduled", "check": "confirm safe available leftovers quantity and reheating duration; must fit before kitchen cleaning; no feasibility approval"}, {"day": "Wednesday", "start": "17:20", "end": "17:50", "action": "Clean kitchen", "status": "draft", "check": "finish before setup"}, {"day": "Wednesday", "start": "18:00", "end": "18:45", "action": "Tea setup", "status": "provisional", "check": "location and guest requirements unresolved"}, {"day": "Wednesday", "start": "19:00", "end": "19:00", "action": "Birthday tea starts", "status": "fixed start", "check": "duration unknown; location unresolved"}], "revised": [{"day": "Monday", "start": "17:35", "end": "18:10", "action": "Chickpea carrot spinach rice", "status": "draft", "check": "active time requires confirmation"}, {"day": "Monday", "start": "18:1 138fc468f17ac0820f06a16"}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let revised=false,approved=false;let active='brief';
const minute=t=>{let[h,m]=t.split(':').map(Number);return h*60+m};const overlap=(a,b,c,d)=>Math.max(0,Math.min(minute(b),minute(d))-Math.max(minute(a),minute(c)));
const viewNames={brief:'Brief',facts:'People',resources:'Resources',availability:'Time',tasks:'Chores',unknowns:'Unknowns',prompt:'Request',output:'Output fields',assumptions:'Draft status',original:'Original schedule',conflict:'Conflict',repair:'Tuesday request',tuesday:'Tuesday revision',resourcecheck:'Resource check',dependencies:'Dependencies',safety:'Safety',review:'Review',calendar:'Calendar copy',event:'Unsaved event',taskgroups:'Task list',fallback:'Notes fallback',next:'Next lesson',workflow:'Workflow'};
const sourceRows=()=>revised?DATA.revised:DATA.original;
const ul=xs=>'<ul>'+xs.map(x=>'<li>'+x+'</li>').join('')+'</ul>';const tasks=xs=>xs.map(x=>'<label><input type="checkbox" disabled> '+x+'</label>').join('');
const card=(h,b,cls='')=>'<section class="'+cls+'"><h2>'+h+'</h2>'+b+'</section>';
const table=(rows,compact=false)=>'<table><thead><tr><th>Day</th><th>Start–end</th><th>Action</th><th>Status</th></tr></thead><tbody>'+rows.map(r=>'<tr class="'+(r.status==='faulty draft'?'red':r.status.includes('provisional')?'amber':'')+'"><td>'+esc(r.day)+'</td><td>'+esc(r.status==='fixed start'?r.start+' start only':r.start&&r.end?r.start+'–'+r.end:'Not scheduled')+'</td><td>'+esc(r.action)+'</td><td>'+esc(r.status)+'</td></tr>').join('')+'</tbody></table>';
function render(){let html='';switch(active){
case'brief':html='<h1>Fictional household planning brief</h1><div class="cols">'+card('Goal','Three evening meals · birthday tea · routine chores')+card('People and preferences','Two adults and one child<br>Vegetarian · no peanuts')+card('Available food and equipment','Rice, chickpeas, carrots, spinach<br>One burner · oven · basic cookware')+card('Missing information','Location · guest requirements · dessert · helper availability')+card('Fixed commitments','Tuesday school18:00–19:30; travel17:40–18:00 and19:30–19:50. Birthday tea: six people Wednesday19:00 start; recycling outside byWednesday08:00.')+card('Available time','Monday17:30–19:00. Tuesday16:45–17:35 then after20:00. Wednesday17:15–18:45. Revised eat/pack ends17:35; departure17:40.')+card('Household tasks','Laundry: wash → dry → put away. Kitchen clean17:20–17:50 before setup18:00–18:45 Wednesday. Recycling outside before its deadline.')+'</div>';break;
case'facts':html='<h1>People and preferences</h1>'+card('Supplied facts',ul(['Meals: two adults and one child','Vegetarian · no peanuts','Three evening meals: Monday–Wednesday','Birthday tea: six people · Wednesday19:00']));break;
case'resources':html='<h1>Resources and limits</h1><div class="cols">'+card('Supplied resources',ul(['Rice · chickpeas','Carrots · spinach','One stovetop burner','Oven · basic cookware']))+card('Limits',ul(['Maximum active meal preparation:35 minutes','Avoid unnecessary shopping','Quantities and exact recipes: not supplied','Missing ingredients: proposed shopping only']),'amber')+'</div>';break;
case'availability':html='<h1>Availability and fixed commitments</h1><table><tr><th>Day</th><th>Available window</th><th>Fixed commitment</th></tr><tr><td>Monday</td><td>17:30–19:00</td><td>—</td></tr><tr><td>Tuesday</td><td>16:45–17:35; after20:00</td><td>School18:00–19:30<br>Travel17:40–18:00 /19:30–19:50</td></tr><tr><td>Wednesday</td><td>17:15–18:45</td><td>Tea19:00 · recycling outside by08:00</td></tr></table>';break;
case'tasks':html='<h1>Household completion conditions</h1>'+card('Laundry','<div class="steps"><b>Wash</b>→<b>Dry</b>→<b>Put away</b></div>')+card('Event preparation','<div class="steps"><b>Clean kitchen</b>→<b>Set up birthday tea</b></div>')+card('Recycling','Outside by Wednesday08:00');break;
case'unknowns':html='<h1>Unknown — do not invent</h1>'+card('Missing information · proposed roles unassigned',ul(['Birthday tea location: tea organizer must confirm','Guest requirements: organizer must ask guests or guardians','Cake or dessert: tea organizer must confirm source','Second adult’s availability: that adult must confirm']),'amber');break;
case'prompt':html='<h1>Planning request</h1>'+card('Confirmed inputs · constraints · missing information','<textarea id="request">Draft three meals, birthday tea and chores using only the supplied household brief. Separate confirmed inputs, assumptions and missing details. Preserve preferences, resources and fixed commitments.</textarea><p class="amber">Do not save events, create tasks, invite guests or make purchases.</p>')+card('Required output','Confirmed facts · assumptions · questions · durations · dependencies · checklists · start/end schedule');break;
case'output':html='<h1>Required output fields</h1>'+card('Structured draft',ul(['1. Confirmed inputs','2. Assumptions','3. Missing information','4. Start, end and duration','5. Dependencies','6. Meal, event and chore checklists','7. Calendar-ready copy']));break;
case'assumptions':html='<h1>Generated draft — not evidence</h1><p class="muted">Scripted teaching fixture; no live assistant response is claimed.</p><div class="cols three">'+card('Confirmed',ul(['Vegetarian; no peanuts','Rice, chickpeas, carrots, spinach','One burner, oven, basic cookware; active prep≤35 minutes','School Tuesday18:00–19:30','Travel Tuesday17:40–18:00 and19:30–19:50','Tea: six people, Wednesday19:00 start','Recycling outside Wednesday08:00']))+card('Assumptions',ul(['Tea occurs at home','Second adult can help']),'amber')+card('Missing',ul(['Location confirmation','Guest requirements','Dessert source']),'amber')+'</div>';break;
case'original':html='<h1>Original planning draft</h1><p>Scripted faulty fixture · not an approved plan</p>'+table(DATA.original.filter(r=>['Chickpea carrot spinach rice','Start laundry','Vegetable tray bake','Clean kitchen','Tea setup'].includes(r.action)))+'<p class="amber">Wednesday leftovers: unscheduled; confirm quantities, storage and reheating time.</p>';break;
case'conflict':{const old=DATA.original.find(r=>r.status==='faulty draft');let m=overlap(old.start,old.end,'17:40','19:50');html='<h1>Tuesday conflict</h1><div class="cols">'+card('Original brief','School18:00–19:30<br>20 minutes travel each way<br>Required departure17:40')+card('Draft cooking','17:30–18:10','red')+'</div><div id="overlap-result">'+card('Required-absence overlap',m+' minutes ·17:40–18:10','red')+'</div><p>Travel-only overlap:20 minutes. The remaining10 minutes overlap the event.</p>';break;}
case'repair':html='<h1>Tuesday-only correction request</h1>'+card('Bounded revision',ul(['Preserve the school event and both travel blocks','Cooking finishes by17:35 or moves after20:00','Do not change Monday or Wednesday','Label every new assumption']))+'<button id="apply-tuesday" data-action="apply-tuesday">Apply supplied Tuesday revision</button>';break;
case'tuesday':html='<h1>Tuesday revision</h1>'+table(DATA.revised.filter(r=>r.day==='Tuesday'&&r.action!=='Put recycling outside'))+'<div id="status">Conditional draft: ingredients ready to use. Cooking35 minutes; eat/pack15 minutes; five-minute gap before departure. The full17:20–17:35 eating/packing interval fits supplied availability through17:35. Ingredient readiness and resources remain conditional.</div><button id="apply-tuesday" data-action="apply-tuesday">Use supplied local revision</button><p id="revision-check">'+(revised?'Revision applied · Monday/Wednesday unchanged · fixed blocks preserved':'Preview of supplied revision; not yet applied')+'</p>';break;
case'resourcecheck':html='<h1>Resource check</h1><table><tr><th>Meal</th><th>Ingredients</th><th>Equipment</th><th>Active time / status</th></tr><tr><td>Monday rice</td><td>Rice, chickpeas, carrots, spinach; quantities to confirm</td><td>One burner planned</td><td>Confirm recipe, quantities and≤35 minutes</td></tr><tr><td>Tuesday rice</td><td>Rice, chickpeas, spinach; ready-to-use assumption</td><td>One burner planned</td><td>35-minute block; ready ingredients assumption</td></tr><tr class="amber"><td>Wednesday leftovers</td><td>Available safe leftovers and quantities unconfirmed</td><td>Method/time unknown</td><td>Unscheduled; do not approve before checks</td></tr><tr class="amber"><td>Event food</td><td>Ingredients proposed only after guest/dessert confirmation</td><td>Oven only after reheating</td><td>Requirements and dessert source unknown</td></tr></table>';break;
case'dependencies':html='<h1>Dependencies</h1>'+card('Laundry','<div class="steps"><b>Wash</b>→<b>Dry</b>→<b>Put away</b></div>')+card('Food list','Confirm location and guest requirements → finalize food list','amber')+card('Setup','Clean kitchen → set up birthday tea');break;
case'safety':html='<h1>General food-safety check</h1>'+card('Planning checklist',ul(['Clean preparation area','Keep raw and cooked food separate','Cook thoroughly','Use safe water and ingredients','Keep prepared food at safe temperatures']))+'<p>General organization, not individualized nutrition advice.</p>';break;
case'review':html='<h1>Review against supplied evidence</h1><div class="cols">'+card('Original brief','Two adults, one child. Vegetarian; no peanuts. Rice/chickpeas/carrots/spinach. One burner +oven; active prep≤35min. Tuesday school18:00–19:30, travel20min each way. Availability Tuesday16:45–17:35 then after20:00; eat/pack17:20–17:35 fits the supplied window. Tea Wednesday19:00, six people. Recycling Wednesday08:00.')+card('Review checklist','<label><input type="checkbox" id="preferences"> Preferences preserved</label><label><input type="checkbox"> Resources available — quantities still need confirmation</label><label><input type="checkbox"> Fixed commitments protected</label><label><input type="checkbox"> Durations checked against supplied windows</label><label><input type="checkbox"> Dependencies ordered</label><label><input type="checkbox"> Unknowns visible</label><label><input type="checkbox" disabled> Guest food requirements confirmed — unresolved</label><p>No external action taken.</p>')+'</div>';break;
case'calendar':html='<h1>Calendar and separate task list</h1><p>Local practice only. No real calendar/account connection. Fixed commitments can be copied; other work remains a draft.</p><button id="copy-approved" data-action="copy-approved">Copy confirmed blocks and start locally</button><div id="calendar-status">'+(approved?'Fixed school/travel blocks and tea start copied locally; provisional work excluded.':'Nothing copied. Review first.')+'</div><div class="cols"><section><h2>Monday–Wednesday calendar</h2><div class="cols three">'+card('Monday','No approved timed work copied. Draft17:35–18:10 meal remains for resource review.','amber')+card('Tuesday',approved?'17:40–18:00 outbound travel<br>18:00–19:30 school event<br>19:30–19:50 return travel':'No commitments copied yet.')+card('Wednesday',approved?'19:00 birthday tea START ONLY; duration unknown.<br>08:00 recycling deadline remains visible.':'No commitments copied yet.')+'</div></section>'+card('Separate flexible task list',tasks(['Meal preparation: confirm quantities/recipe','Tuesday eat/pack:17:20–17:35,15-minute draft; readiness still conditional','Laundry: wash → dry → put away','Kitchen clean → tea setup: keep draft order','Recycling: adult/access unconfirmed','Event food/location/dessert: waiting information']),'amber')+'</div><p class="amber">No provisional meal, chore, setup or guest action is approved by this copy. Proposed roles remain unassigned.</p>';break;
case'event':html='<h1>Unsaved event draft</h1>'+card('Birthday tea setup','<p>Wednesday18:00–18:45 · provisional; location unresolved</p><label>Guests <input id="guests" type="text" value="" placeholder="Leave empty"></label><label>Sharing <input id="sharing" type="text" value="" placeholder="Leave empty"></label><p>Creating, inviting and sharing are separate actions.</p><strong>No save or send action is available in this local exercise.</strong>','amber');break;
case'taskgroups':html='<h1>Task groups</h1><div class="cols three">'+card('Meals',tasks(['Monday rice: draft','Tuesday rice: conditional','Wednesday leftovers: unscheduled']))+card('Birthday tea',tasks(['Location: waiting for tea organizer','Guest requirements: waiting for organizer to ask guests/guardians','Dessert source: waiting for tea organizer']),'amber')+card('Household',tasks(['Wash → dry → put away','Clean before setup','Recycling: confirm adult and placement']))+'</div><p>Status: confirmed · provisional · waiting for information. All confirming roles are proposed and unassigned; no helper availability is assumed.</p>';break;
case'fallback':html='<h1>When · Action · Check</h1><table><tr><th>When</th><th>Action</th><th>Check</th></tr><tr><td>Tuesday17:40</td><td>Depart for school event</td><td>Fixed</td></tr><tr class="amber"><td>Tuesday20:05–20:10?</td><td>Put recycling outside</td><td>? adult/access confirmation</td></tr><tr class="amber"><td>Wednesday: not scheduled</td><td>Leftover meal before tea</td><td>? quantities and reheating time</td></tr><tr><td>Wednesday08:00 deadline</td><td>Recycling must be outside</td><td>Tick only when actually complete</td></tr></table>';break;
case'next':html='<h1>Next: Revise When the Plan Changes</h1>'+card('Lesson125','<div class="steps"><b>Existing plan</b><b class="amber">Delay?</b><b>Completed work retained</b></div>');break;
case'workflow':html='<h1>Planning workflow</h1><div class="steps"><b>Facts and constraints</b>→<b>Structured draft</b>→<b>Assumptions and gaps</b>→<b>Time, resources, dependencies</b>→<b>Approved copy</b>→<b>Manual fallback</b></div>';break;
}document.querySelector('#main').innerHTML=html;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===active)));}
window.showView=name=>{if(!viewNames[name])throw Error('Unknown view');active=name;render()};document.querySelector('#nav').innerHTML=Object.entries(viewNames).map(([k,v])=>'<button id="v-'+k+'" data-view="'+k+'">'+v+'</button>').join('');document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)showView(b.dataset.view);if(b.dataset.action==='apply-tuesday'){revised=true;active='tuesday';render()}if(b.dataset.action==='copy-approved'){approved=true;render()}});let q=new URLSearchParams(location.search).get('view');if(q&&viewNames[q])active=q;render();window.academyPlanner={DATA,getState:()=>({active,revised,approved}),overlap,minute};
</script></html>
