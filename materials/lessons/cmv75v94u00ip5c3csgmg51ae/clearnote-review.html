<!doctype html><html lang="en"><meta charset="utf-8"><title>ClearNote Review — Academy practice</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172c44;font:24px/1.35 Arial}main{margin:42px 150px;padding:24px 32px;background:white;min-height:990px}header{font-size:20px;border-bottom:1px solid #bdcbd9;padding-bottom:10px}h1{font-size:35px;margin:18px 0}h2{font-size:26px;margin:8px 0}p{margin:12px 0}section{border:1px solid #bdcbd9;padding:16px;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid section{margin:0}button{font:21px Arial;padding:10px;margin:8px 8px 8px 0}textarea{width:100%;font:23px/1.35 Arial;padding:14px}audio{height:38px;width:70%;vertical-align:middle}canvas{width:100%;height:44px}input[type=checkbox]{width:23px;height:23px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bdcbd9;text-align:left;padding:15px}a{color:#13559c}.small{font-size:16px}</style><main><header>ClearNote Review • Academy-authored fictional training workspace</header><div class="small">Synthetic teaching source • intentional silent spacers,overlap and unclear fragment • no external AI/sharing</div><canvas aria-label="Actual native PCM waveform"></canvas><audio controls preload="auto" src="practice-recording.wav"></audio><span id="position">00:00</span><label for="view" class="small">Practice view: </label><select id="view" style="font:18px Arial;padding:5px;max-width:600px"><option value="evidence">Evidence</option><option value="workflow">Workflow</option><option value="permission">Permission</option><option value="workspace">Workspace</option><option value="instruction">Instruction</option><option value="draft">Draft</option><option value="decision">Decision</option><option value="overlap">Overlap</option><option value="decision-proposal">Decision Proposal</option><option value="action">Action</option><option value="mei">Mei</option><option value="budget">Budget</option><option value="disagreement">Disagreement</option><option value="reviewed">Reviewed</option><option value="context">Context</option><option value="distribution">Distribution</option><option value="recipients">Recipients</option><option value="minimal">Minimal</option><option value="attachments">Attachments</option><option value="confirmation">Confirmation</option><option value="manual">Manual</option><option value="unclear">Unclear</option><option value="personal">Personal</option><option value="checklist">Checklist</option><option value="outcomes">Outcomes</option><option value="signs">Signs</option><option value="signs-corrected">Signs Corrected</option><option value="next">Next</option><option value="checked">Checked</option></select><div id="content"></div></main><script>const states={"evidence": "<h1>Review evidence separately</h1><div class=\"grid\"><section><h2>RECORDING</h2><p>Permission-cleared synthetic source</p><button data-seek=\"198\">Play decision03:18</button></section><section><h2>TRANSCRIPT</h2><p>Corrected authored evidence</p><a href=\"corrected-transcript.md\">Open accessible transcript</a></section><section><h2>GENERATED DRAFT</h2><p>Not yet verified</p><a href=\"generated-draft.md\">Open deliberately flawed fixture</a></section></div>", "workflow": "<h1>Compare evidence, then recipients</h1><section><h2>Recording+corrected transcript \u2192 Summary draft</h2><p>Verify names, dates, decisions, actions and uncertainty.</p></section><section><h2>Recipients+attachments \u2192 Approval decision</h2><p>Keep as draft until both reviews pass.</p></section>", "permission": "<h1>Community Garden Planning \u2014 Training Recording</h1><section><h2>Permission-cleared sample</h2><p>Amina \u2022 Diego \u2022 Mei</p><p>Fictional authorization: recording for written notes.</p><p>This does not authorize unrestricted distribution.</p></section>", "workspace": "<h1>Community Garden Planning \u2014 Training Recording</h1><p>Permission-cleared sample \u2022 exact native audio controls above</p><div class=\"grid\"><section><h2>Transcript</h2><p>03:18 Amina: Saturday, 24 October 2026 at nine works for the cleanup.</p><a href=\"corrected-transcript.md\">Open full corrected source transcript</a></section><section><h2>Generated summary</h2><p>Generated draft\u2014Not yet verified</p><p>Mei contacts all residents. Supply budget approved:300.</p><p>Deliberately planted exercise errors.</p></section></div>", "instruction": "<h1>Summary instruction</h1><label for=\"instruction\">Input source: practice-recording.wav attached locally</label><textarea id=\"instruction\" rows=\"5\">Create a short meeting summary. Separate confirmed decisions, proposed ideas, actions, and open questions. Preserve names and dates. Mark missing owners or deadlines as unconfirmed.</textarea><button id=\"copy-instruction\">Copy instruction</button><p id=\"copy-status\"></p>", "draft": "<h1>Generated draft\u2014Not yet verified</h1><p>Academy-authored deliberately flawed fixture; not an observed assistant response.</p><section><p>Cleanup: Saturday, 24 October 2026 at 09:00.</p><p>Decisions: invite neighboring group; buy new tools.</p><p>Supply budget approved:300.</p><p>Mei contacts all residents; prepares signs by Friday.</p></section>", "decision": "<h1>Verify the decision at 03:18</h1><button data-seek=\"198\">Decision 03:18</button><section><h2>Amina \u2014 source-script role</h2><p>Saturday,24 October 2026,at nine works for the cleanup.</p></section><section><h2>Summary line \u2713</h2><p>Cleanup: Saturday, 24 October 2026 at 09:00.</p></section>", "overlap": "<h1>Check speaker labels in context</h1><button data-seek=\"218\">Replay surrounding conversation</button><section><h2 style=\"border:2px solid #ba8200\">Amina \u2014 authored source role, verify in context</h2><p>03:40 Saturday at nine works.</p><p>03:40.9 Diego: I will check our tools before we buy anything.</p></section><p>Speaker attribution checked against surrounding conversation. The native audio genuinely overlaps; similar synthetic voices do not establish real identity.</p>", "decision-proposal": "<h1>Decisions and proposals</h1><section><h2>CONFIRMED DECISION</h2><p>Cleanup: Saturday, 24 October 2026 at 09:00.</p></section><section><h2>PROPOSED IDEA</h2><p>Invite the neighboring group. Not accepted as a decision.</p><button data-seek=\"250\">Replay 04:10 proposal</button></section>", "action": "<h1>Task \u2022 Owner \u2022 Deadline</h1><button data-seek=\"342\">Inventory 05:42</button><section><p>Task: check the tool inventory</p><p>Owner: Diego</p><p>Deadline:20 October 2026</p></section>", "mei": "<h1>Correct the action scope</h1><section><h2>Unsupported draft</h2><p>Mei will contact all residents.</p></section><section><h2>Source-supported correction</h2><p>Mei offered to draft a note for registered volunteers. Deadline unconfirmed.</p><button data-seek=\"365\">Replay 06:05</button></section>", "budget": "<h1>Keep the budget uncertainty visible</h1><section><h2>Unsupported draft amount</h2><p>300 \u2014 REMOVE; no source support.</p></section><section><h2>Reviewed wording</h2><p>Supply budget amount unconfirmed.</p><button data-seek=\"395\">Replay unclear06:35 fragment</button><button data-seek=\"410\">Replay 06:50 context</button></section>", "disagreement": "<h1>Tool purchase remains open</h1><div class=\"grid\"><section><h2>Diego</h2><p>Suggested buying new tools.</p><button data-seek=\"280\">Replay 04:40</button></section><section><h2>Amina</h2><p>Preferred checking existing stock first.</p><button data-seek=\"292\">Replay 04:52</button></section></div><p>UNRESOLVED \u2014 no agreement invented.</p>", "reviewed": "<h1>Reviewed summary \u2014 fictional worked answer</h1><section><p>Confirmed: cleanup Saturday, 24 October 2026 at 09:00.</p><p>Diego: inventory by 20 October 2026.</p><p>Mei: draft for registered volunteers; deadline unconfirmed.</p><p>Open: budget amount, tool purchase, invitation proposal, signs owner/deadline.</p></section><a href=\"Reviewed summary.pdf\" target=\"_blank\">Open actualReviewed summary.pdf</a>", "context": "<h1>Replay a phrase with context</h1><button id=\"rewind\">Rewind5seconds</button><button data-seek=\"390\">Replay surrounding budget context</button><section><p>Preserve conditions, corrections and uncertainty.</p><p>\u201cSupply budget amount unconfirmed.\u201d</p></section>", "distribution": "<h1>Recording permission \u2260 distribution permission</h1><section><h2>Allowed fictional purpose</h2><p>Record for written notes.</p></section><section><h2>Separate checks</h2><p>Who needs which reviewed version? Is wider distribution established?</p><p>No unrestricted recording, transcript or summary sharing.</p></section>", "recipients": "<h1>Recipient and version check</h1><table><tr><th>Recipient</th><th>Reason</th><th>Version/status</th></tr><tr><td>Amina, Diego, Mei</td><td>Participants</td><td>Reviewed meeting record</td></tr><tr><td>Registered volunteers</td><td>Later event logistics</td><td>Separate minimal update \u2014 pending approval</td></tr><tr><td>Public community list</td><td>No established purpose</td><td>DO NOT SHARE</td></tr></table>", "minimal": "<h1>Share the smallest appropriate version</h1><section><h2>Registered volunteers</h2><p>May later need event date and logistics.</p><p>Separate approved minimal update \u2014 pending.</p></section><section><h2>Do not include</h2><p>Raw transcript, unresolved internal discussion or full participant record.</p></section>", "attachments": "<h1>Inspect attachments</h1><p><label><input type=\"checkbox\" id=\"summary-attachment\" checked>Reviewed summary.pdf</label><a href=\"Reviewed summary.pdf\" target=\"_blank\">Open actual file</a></p><p><label><input type=\"checkbox\" class=\"extra\">Original recording</label></p><p><label><input type=\"checkbox\" class=\"extra\">Raw transcript</label></p><p><label><input type=\"checkbox\" class=\"extra\">Generated draft</label></p><p>Attach only the approved artifact required for this purpose.</p><button id=\"attachment-check\">Check selection</button><p id=\"attachment-result\"></p>", "confirmation": "<h1>Final confirmation \u2014 no message sent</h1><section><p>Content: Reviewed summary</p><p>Recipients: Amina, Diego, Mei</p><p>Unconfirmed items labeled: Yes</p><p>Attachments checked: Yes</p></section><button data-state=\"draft\">Return to draft</button><button id=\"approve-local\">Approve for sharing</button><p id=\"approval-result\">Local training state only; no external destination.</p>", "manual": "<h1>Manual timestamped notes</h1><button data-seek=\"198\">Replay03:18</button><label for=\"manual-note\">Decision,action or open question with timestamp</label><textarea id=\"manual-note\" rows=\"5\">03:18 Decision: Cleanup Saturday, 24 October 2026 at09:00.\n05:42 Action: Diego checks inventory by20October2026.\nOpen question: Tool purchase unresolved.\nUnclear: Supply budget amount unconfirmed.</textarea><button id=\"save-manual\">Keep local note</button><p id=\"manual-status\"></p>", "unclear": "<h1>Confirm before sharing</h1><section><h2>Supply budget amount \u2014 unclear</h2><p>Owner, deadline, amount or recipient uncertain? Ask the relevant person to confirm it.</p></section><section><h2>Recipient check \u2014 fictional reviewed participant record</h2><p><label><input type=\"checkbox\" checked>Amina</label> <label><input type=\"checkbox\" checked>Diego</label> <label><input type=\"checkbox\" checked>Mei</label></p><p><label><input type=\"checkbox\">Public list \u2014 no established purpose; do not share</label></p></section><p>No sending service. Keep unsupported information unconfirmed.</p>", "personal": "<h1>Personal note \u2014 for me only</h1><p class=\"small\">Academy-authored fictional written voice-note script; not a real or uploaded recording.</p><label for=\"personal-note\">Original source note</label><textarea id=\"personal-note\" rows=\"2\">Ask Sam about three notebooks for the project. This note is only for me.</textarea><label for=\"personal-result\">Organized result to compare against the source</label><textarea id=\"personal-result\" rows=\"2\">Name:Sam; Quantity:three notebooks; Audience:Only me.</textarea><button id=\"check-personal\">Compare this fictional fixture</button><p><label><input type=\"checkbox\" id=\"personal-name\">Name checked</label> <label><input type=\"checkbox\" id=\"personal-quantity\">Quantity checked</label> <label><input type=\"checkbox\" id=\"personal-audience\">Audience checked</label></p><p id=\"personal-check-result\">Not checked in this browser session.</p><p>Audience:Only me</p><button disabled>Share disabled</button>", "checklist": "<h1>Seven approval checks</h1><p><label><input type=\"checkbox\" class=\"seven\">Names and speakers right?</label></p><p><label><input type=\"checkbox\" class=\"seven\">Dates and numbers right?</label></p><p><label><input type=\"checkbox\" class=\"seven\">Decisions separate from suggestions?</label></p><p><label><input type=\"checkbox\" class=\"seven\">Actions supported?</label></p><p><label><input type=\"checkbox\" class=\"seven\">Qualifications preserved?</label></p><p><label><input type=\"checkbox\" class=\"seven\">Uncertainties visible?</label></p><p><label><input type=\"checkbox\" class=\"seven\">Recipients and attachments appropriate?</label></p><button id=\"seven-check\">Check readiness</button><p id=\"seven-result\"></p>", "outcomes": "<h1>Review outcomes</h1><section><h2>APPROVE</h2><p>Evidence and audience clear.</p></section><section><h2>REVISE / REQUEST CONFIRMATION</h2><p>Something missing.</p></section><section><h2>STOP</h2><p>Cannot establish safe content,permission or destination.</p></section>", "signs": "<h1>Check the proposed signs task</h1><section><p>The audio says:\u201cSomeone from the volunteer team could prepare signs.\u201d</p><p>The draft says:\u201cMei will prepare signs by Friday.\u201d</p></section><button id=\"sign-approve\">Approve</button><button id=\"sign-correct\">Correct</button><button id=\"sign-share\">Share with everyone</button><p id=\"sign-result\"></p>", "signs-corrected": "<h1>Return for confirmation</h1><section><p>Proposed action: A volunteer may prepare signs. Owner and deadline unconfirmed.</p></section><p>RETURN FOR CONFIRMATION</p><button disabled>Share disabled</button>", "next": "<h1>Stage 19 complete</h1><section><h2>Lesson 115</h2><p>Separate Facts,Preferences and Constraints</p><p>Prepare information for a fair comparison.</p></section>", "checked": "<h1>CONTENT CHECKED \u2014 RECIPIENTS CONFIRMED</h1><section><p>Fictional local exercise approval only.</p><p>Reviewed summary;Amina, Diego, Mei.</p><p>Unconfirmed budget/tool/signs items stay visible.</p><a href=\"practice-recording.wav\">Original synthetic recording \u2014 linked,not attached</a></section><p>No send action completed.</p>"};const root=document.querySelector('#content'),audio=document.querySelector('audio');document.querySelector('#view').addEventListener('change',e=>render(e.target.value));function render(key){document.querySelector('audio').style.display=key==='personal'?'none':'';document.querySelector('canvas').style.display=key==='personal'?'none':'';document.querySelector('#position').style.display=key==='personal'?'none':'';document.querySelector('#view').value=key;root.innerHTML=states[key]||states.evidence;document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>render(b.dataset.state));document.querySelectorAll('[data-seek]').forEach(b=>b.onclick=async()=>{audio.currentTime=Number(b.dataset.seek);await audio.play()});document.querySelector('#rewind')?.addEventListener('click',()=>{audio.currentTime=Math.max(0,audio.currentTime-5)});document.querySelector('#check-personal')?.addEventListener('click',()=>{const original=document.querySelector('#personal-note').value,result=document.querySelector('#personal-result').value;const name=original.includes('Sam')&&result.includes('Sam'),quantity=original.includes('three notebooks')&&result.includes('three notebooks'),audience=original.includes('only for me')&&result.includes('Only me');document.querySelector('#personal-name').checked=name;document.querySelector('#personal-quantity').checked=quantity;document.querySelector('#personal-audience').checked=audience;document.querySelector('#personal-check-result').textContent=name&&quantity&&audience?'Name Sam, quantity three notebooks and audience Only me match the authored source.':'Mismatch: preserve original name Sam, quantity three notebooks and audience Only me.'});document.querySelector('#copy-instruction')?.addEventListener('click',async()=>{await navigator.clipboard.writeText(document.querySelector('#instruction').value);document.querySelector('#copy-status').textContent='Instruction copied; no model request sent.'});document.querySelector('#attachment-check')?.addEventListener('click',()=>{document.querySelector('#attachment-result').textContent=document.querySelector('#summary-attachment').checked&&!Array.from(document.querySelectorAll('.extra')).some(x=>x.checked)?'Reviewed summary only — pass':'Remove extra attachments or select reviewed summary';});document.querySelector('#approve-local')?.addEventListener('click',()=>{document.querySelector('#approval-result').textContent='Local practice approval recorded. No message sent.'});document.querySelector('#save-manual')?.addEventListener('click',()=>{sessionStorage.setItem('manual-note',document.querySelector('#manual-note').value);document.querySelector('#manual-status').textContent='Kept locally for this browser session; no upload.'});document.querySelector('#seven-check')?.addEventListener('click',()=>{document.querySelector('#seven-result').textContent=Array.from(document.querySelectorAll('.seven')).every(x=>x.checked)?'Seven checks completed — choose evidence-based outcome':'Keep as draft; complete missing checks';});document.querySelector('#sign-correct')?.addEventListener('click',()=>render('signs-corrected'));for(const id of ['sign-approve','sign-share'])document.querySelector('#'+id)?.addEventListener('click',()=>{document.querySelector('#sign-result').textContent='STOP:owner and deadline unsupported; no sharing performed.'});}render(new URLSearchParams(location.search).get('state')||'evidence');fetch('practice-recording.wav').then(r=>{if(!r.ok)throw Error('Source recording unavailable');return r.blob()}).then(blob=>{audio.src=URL.createObjectURL(blob);window.nativeAudioSourceLoaded=true});audio.addEventListener('timeupdate',()=>{const t=Math.floor(audio.currentTime);document.querySelector('#position').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')});fetch('waveform-native.json').then(r=>r.json()).then(w=>{const c=document.querySelector('canvas'),ctx=c.getContext('2d');c.width=1500;c.height=44;ctx.fillStyle='#195b80';for(let x=0;x<c.width;x++){const a=w.bins.slice(Math.floor(x*w.bins.length/c.width),Math.floor((x+1)*w.bins.length/c.width));const y=Math.max(1,Math.max(...a)*44);ctx.fillRect(x,22-y/2,1,y)}window.nativeWaveformSource=w.sourceWAVSHA256});</script></html>
