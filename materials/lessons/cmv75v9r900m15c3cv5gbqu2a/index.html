<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Academy Price Evidence Practice</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#172a3a;font:19px/1.45 system-ui,sans-serif}header{background:#173b57;color:white;padding:18px 7%}header p{font-size:15px;margin:6px 0}nav{display:flex;gap:10px;padding:16px 7%;flex-wrap:wrap}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #788b99;border-radius:5px}button{background:#e7f0f7;cursor:pointer}main{margin:0 auto 45px;max-width:1360px;width:84%;background:white;padding:28px;border-radius:9px}h1,h2,h3{line-height:1.2}label{display:block;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.card{border:1px solid #acbecb;border-radius:8px;padding:20px;margin:14px 0}.notice{background:#fff3d4;padding:12px;border-left:5px solid #9d7612}.good{color:#176341}.bad{color:#9c2929}dt{font-weight:650}dd{margin:0 0 12px}table{border-collapse:collapse;width:100%;font-size:16px}td,th{border:1px solid #a5b3bc;padding:8px;text-align:left}td[contenteditable]{background:#fff8df}.small{font-size:15px}.price{font-size:30px;font-weight:bold}.muted{color:#536675}a{color:#125a8d}@media(max-width:800px){.grid{grid-template-columns:1fr}main{width:94%;padding:18px}}</style><header><strong>Emmanuel Corels Academy — Evidence Practice</strong><p>Fictional local teaching app · No live prices/search/maps · No purchase/booking · Fixed example: 14 October 2026 07:10 UTC</p></header><nav><button onclick="view('brief')">Requirement</button><button onclick="view('search')">Shortlist</button><button onclick="view('product','northstar')">Northstar Outfitters</button><button onclick="view('product','trail')">Trail Market</button><button onclick="view('hotel')">Hotel practice</button><button onclick="view('sheet')">Comparison sheet</button><button onclick="view('directory')">Directory card</button><button onclick="view('checklist')">Checking sequence</button></nav><main id="app"></main><script>
const app=document.querySelector('#app');let seller='northstar',refreshed=false;const stamp='14 October 2026 07:10 UTC';const requirement='Two Northstar Trail backpacks · 30 L · Dark Blue · Needed by 23 October 2026';
function view(v,s){if(s)seller=s;history.replaceState(null,'','#'+v);if(v==='product')return product();if(v==='hotel')return hotel();if(v==='sheet')return sheet();if(v==='directory')return directory();if(v==='checklist')return checklist();if(v==='search')return search();app.innerHTML=`<h1>Check exact requirements before comparing</h1><p class="notice">${requirement}</p><h2>Five required evidence fields</h2><ol><li>Exact option</li><li>Required date</li><li>Quantity or occupancy</li><li>Current availability for that selection</li><li>Full payable cost</li></ol><p>We created this example. We will not place an order. All figures and the historical check time are fixed exercise data, never verified current offers.</p><button onclick="view('search')">Find candidate listings</button>`}
function search(){app.innerHTML=`<h1>Candidate search practice</h1><label for="request">Request</label><textarea id="request" rows="3" style="width:100%">Find candidate listings for two Northstar Trail backpacks, 30 L, dark blue, deliverable by 23 October 2026. Include links. Do not claim verification.</textarea><button onclick="document.querySelector('#results').hidden=false">Show scripted practice shortlist</button><section id="results" hidden><h2>GENERATED SHORTLIST — NOT VERIFIED</h2><p class="notice">Scripted teaching fixture; no AI or web request is made. A search snippet is a lead, not proof.</p><div class="card"><h3>Northstar Outfitters</h3><p>Northstar Trail Backpack — from 48.00 · In stock (illustrative snippet)</p><button onclick="view('product','northstar')">Open fixture source page</button></div><div class="card"><h3>Trail Market</h3><p>Northstar Trail family — from 43.00 · In stock (illustrative snippet)</p><button onclick="view('product','trail')">Open fixture source page</button></div><div class="card"><h3>Ridge Store</h3><p>Illustrative third candidate; exact variant, stock and delivered total unresolved. No offer is supplied.</p></div></section>`}
function product(){const trail=seller==='trail';app.innerHTML=`<h1>${trail?'Trail Market':'Northstar Outfitters'}</h1><p class="small">Self-created fictional retailer source page · ${stamp} (fixed fixture)</p><h2>Northstar Trail Backpack</h2><p class="notice">Requirement: ${requirement}</p><div class="grid"><section><label>Capacity <select id="capacity" onchange="recalculate()"><option ${trail?'selected':''}>22 L</option><option ${trail?'':'selected'}>30 L</option></select></label><label>Colour <select id="colour" onchange="recalculate()"><option ${trail?'selected':''}>Black</option><option ${trail?'':'selected'}>Dark Blue</option></select></label><label>Quantity <input id="quantity" type="number" min="1" max="5" value="${trail?1:2}" onchange="recalculate()"></label><label>Fictional broad delivery area <input id="area" placeholder="Enter destination to calculate" oninput="recalculate()"></label><label><input type="checkbox" id="wrap" onchange="recalculate()"> Optional gift wrap 6.00</label><button onclick="refreshed=true;recalculate()">Refresh local stock fixture</button><p class="small">Refresh changes this simulation to one available. It does not fetch a real provider.</p></section><section id="breakdown" class="card"></section></div><div class="card"><strong>Final action under your control</strong><p>No Place order action exists. Do not enter personal data or payment details. Open the real provider and refresh all conditions for any real decision.</p></div>`;recalculate()}
function recalculate(){const cap=document.querySelector('#capacity').value,col=document.querySelector('#colour').value,q=Number(document.querySelector('#quantity').value),area=document.querySelector('#area').value.trim(),wrap=document.querySelector('#wrap').checked,correct=cap==='30 L'&&col==='Dark Blue',trail=seller==='trail',unit=correct?(trail?51:48):43,available=refreshed?1:(trail&&correct?1:2),valid=Number.isInteger(q)&&q>=1&&q<=5,can=valid&&q<=available,known=area.length>0&&can,items=unit*q;document.querySelector('#breakdown').innerHTML=`<h3>Exact selection</h3><p>${col} ${cap} · Quantity ${valid?q:'invalid'} · Unit ${unit.toFixed(2)}</p><p class="${correct?'good':'bad'}">${correct?'EXACT MATCH':'DIFFERENT VARIANT'}</p><p class="${can?'good':'bad'}">${available===1?'Only one available':'Two available'}${can?'':' — REQUIRED QUANTITY UNAVAILABLE'}</p><dl><dt>Items</dt><dd>${can?items.toFixed(2):'—'}</dd><dt>Delivery</dt><dd>${known?'8.00':'— Enter destination / resolve quantity'}</dd><dt>Mandatory service charge</dt><dd>${known?'2.00':'—'}</dd><dt>Optional gift wrap</dt><dd>6.00 · ${wrap?'selected':'not selected'}</dd><dt>Current payable total</dt><dd class="price">${known?(items+10+(wrap?6:0)).toFixed(2):'— Unresolved'}</dd><dt>Estimated arrival</dt><dd>${known?'21–22 October 2026 · estimate, not guarantee':'—'}</dd></dl><p class="small">Missing information is not zero. Stock/delivery fixture may change; fixed time is not permanent approval.</p>`}
function hotel(){app.innerHTML=`<h1>Fictional hotel comparison</h1><p class="small">Self-created booking practice, no booking or real availability · ${stamp}</p><div class="grid"><section><label>Destination <input id="destination" value="Riverside" onchange="hotelcalc()"></label><label>Check-in <input id="checkin" type="date" value="2026-11-04" onchange="hotelcalc()"></label><label>Check-out <input id="checkout" type="date" value="2026-11-06" onchange="hotelcalc()"></label><label>Adults <input id="adults" type="number" value="2" min="1" onchange="hotelcalc()"></label><label>Rooms <input id="rooms" type="number" value="1" min="1" onchange="hotelcalc()"></label><label>Room type <select id="roomtype" onchange="hotelcalc()"><option>Standard Double</option></select></label><label><input id="breakfast" type="checkbox" onchange="hotelcalc()"> Optional breakfast 30.00</label></section><section id="hotelresult" class="card"></section></div><details><summary>Cancellation conditions</summary><p>Free cancellation until 30 October 2026; later cancellation charge applies. The amount of that later charge is not specified in this fixture; keep it unresolved.</p></details>`;hotelcalc()}
function htmlEscape(t){return String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function hotelcalc(){const selection=['destination','checkin','checkout','adults','rooms'].map(id=>document.querySelector('#'+id).value);const valid=document.querySelector('#destination').value==='Riverside'&&document.querySelector('#checkin').value==='2026-11-04'&&document.querySelector('#checkout').value==='2026-11-06'&&document.querySelector('#adults').value==='2'&&document.querySelector('#rooms').value==='1',breakfast=document.querySelector('#breakfast').checked;document.querySelector('#hotelresult').innerHTML=`<h2>Harbour House</h2><p>Selected: Standard Double · ${htmlEscape(selection[0])} · ${htmlEscape(selection[1])} to ${htmlEscape(selection[2])} · ${htmlEscape(selection[3])} adults · ${htmlEscape(selection[4])} rooms</p><p class="${valid?'good':'bad'}">${valid?'Available for selected fixture dates':'No fixture evidence for changed selection — unresolved'}</p><dl><dt>NIGHTLY basis</dt><dd>${valid?'90.00 × two nights':'—'}</dd><dt>Room for two nights</dt><dd>${valid?'180.00':'—'}</dd><dt>Mandatory charges</dt><dd>${valid?'24.00':'—'}</dd><dt>Optional breakfast</dt><dd>30.00 · ${breakfast?'selected':'not selected'}</dd><dt>TOTAL FOR STAY</dt><dd class="price">${valid?(204+(breakfast?30:0)).toFixed(2):'—'}</dd></dl><p>Normalize nightly versus stay totals before comparing. No booking action is available.</p>`}
function directory(){app.innerHTML=`<h1>Fictional directory card</h1><section class="card"><h2>Trail Market</h2><p>OPEN — illustrative opening status</p><p>No address, real map or live listing is supplied. Opening status does not prove exact product stock.</p><button onclick="view('product','trail')">Open retailer practice source</button></section><p class="notice">Directory opening status is not inventory evidence. Select Dark Blue30L and quantity2 on the source page: only one is available.</p>`}
function sheet(){const headers=['Checked time','Exact option','Quantity/date','Availability','Base','Mandatory','Optional','Delivery/cancellation','Total','Source','Unresolved'];const rows=[[stamp,'Northstar Trail30L DarkBlue','2; needed23October2026; Academy practice area','Meets fixture requirements','96.00','10.00','6.00 notselected','Estimate21–22October2026','106.00','Northstar source','Refresh before purchase'],[stamp,'Northstar Trail30L DarkBlue','2; needed23October2026','Only one available','','','','','','Trail source','Unavailable for quantity'],[stamp,'Harbour House StandardDouble','4–6November2026;2adults;1room','Available fixture','180.00','24.00','30.00 notselected','Free cancellation until30October2026','204.00','Hotel source','Later cancellation amount unresolved']];app.innerHTML=`<h1>Self-created comparison sheet v1</h1><p class="notice">Editable local exercise sheet. Fixed example data — no automatic real-world verification. Edits stay only in this page; export edited rows or copy them before navigating away. Source links open landing pages; reselect the recorded exact variant, quantity and delivery area before checking.</p><div style="overflow:auto"><table><thead><tr>${headers.map(t=>'<th>'+t+'</th>').join('')}</tr></thead><tbody>${(new URLSearchParams(location.search).get('stage')==='blank'?Array.from({length:3},()=>Array(11).fill('')):rows).map(r=>'<tr>'+r.map((t,i)=>'<td '+(i===9&&t?'':'contenteditable="true"')+'>'+(i===9&&t?'<a href="?view='+ (t==='Hotel source'?'hotel':'product&seller='+(t==='Trail source'?'trail':'northstar'))+'">'+t+' (landing page; reselect exact options)</a>':t)+'</td>').join('')+'</tr>').join('')}</tbody></table></div><button id="export" onclick="exportRows()">Export edited rows as CSV</button><p><a href="comparison-blank.csv" download>Download blank CSV</a> · <a href="comparison-expected.csv" download>Download fixture answer key</a></p>`}
function checklist(){app.innerHTML='<h1>Evidence-first sequence</h1><ol><li>Shortlist — candidates</li><li>Open — current source page</li><li>Select — exact option</li><li>Calculate — cost breakdown</li><li>Record — checked '+stamp+'</li></ol><p class="notice">All five evidence fields need source support. Missing information stays unresolved. This timestamp labels a fictional historical exercise, not a live check.</p><h2>Manual route</h2><p>Regular search → opened provider → exact selection → basic evidence sheet. A shop being open does not prove inventory. Do not let an AI summary or a polished table substitute for the actual current transaction page.</p><h3>Next: Lesson135 — Compare Reviews and Marketing Claims</h3>'}
function exportRows(){const rows=Array.from(document.querySelectorAll('table tr')).map(tr=>Array.from(tr.querySelectorAll('th,td')).map(c=>'"'+c.innerText.replaceAll('"','""')+'"').join(','));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='comparison-your-edited-rows.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const params=new URLSearchParams(location.search);view(params.get('view')||location.hash.slice(1)||'brief',params.get('seller')||'northstar');
</script></html>
