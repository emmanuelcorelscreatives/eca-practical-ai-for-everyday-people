<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClearTask Worksheet — fictional practice</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#15283b;font:22px/1.5 system-ui,sans-serif}header{padding:24px 7%;background:white;border-bottom:1px solid #ced7e2}h1{font-size:32px;margin:0}header small{font-size:16px;color:#526579}nav{padding:16px 7%;display:flex;flex-wrap:wrap;gap:8px}button,select{font:inherit;padding:8px 14px;border:1px solid #a6b6c9;border-radius:7px;background:white;cursor:pointer}button:focus,select:focus,textarea:focus{outline:3px solid #2576c5}main{margin:8px auto 40px;width:84%;max-width:1750px}article,aside{padding:28px;background:white;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:18px}h2{font-size:30px;margin:0 0 18px}h3{font-size:23px}pre{font:inherit;white-space:pre-wrap;margin:0}table{width:100%;border-collapse:collapse;font-size:20px}th,td{text-align:left;padding:10px;border-bottom:1px solid #dbe2ea}th{background:#e9eff6}.pass{color:#12683d;font-weight:bold}.fail{color:#a51f2c;font-weight:bold}.optional{color:#8b5700;font-weight:bold}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}textarea{width:100%;min-height:240px;font:inherit;padding:14px}mark{background:#fff0a3}.note{font-size:18px;color:#4c5e70}.big{font-size:27px}#wordTokens{display:flex;flex-wrap:wrap;gap:12px}#wordTokens span{padding:4px 8px;background:#edf3fa}.selected{border-left:7px solid #14805b}strong{font-weight:750}@media(max-width:950px){.grid{grid-template-columns:1fr}body{font-size:18px}main{width:90%}}
</style><header><h1 id="appName">ClearTask Worksheet</h1><small>Emmanuel Corels Academy · Self-created fictional practice · No external actions</small></header><nav><select id="state" aria-label="Practice view"></select><button id="prev">Previous</button><button id="next">Next</button><button id="download">Download decision</button></nav><main id="main"></main><script>
const versions={"first-weak-output.txt": "Riverside Reading Circle\nJoin us on Saturday, 24 October 2026, from 14:00–16:00 in the Maple Room, Eastside Community Centre. Entry is free. Bring one short public-domain poem. Everyone is welcome. Enjoy an afternoon of reading together.\n", "v1-factual-correction.txt": "Riverside Reading Circle. Join us on Saturday, 24 October 2026, from 14:00–16:00 in the Maple Room, Eastside Community Centre. Entry is free. Bring one short public-domain poem. Register by 20 October. Registration method not supplied.\n", "v2-selected-notice.txt": "Riverside Reading Circle\nSaturday, 24 October 2026, 14:00–16:00\nMaple Room, Eastside Community Centre\nFree. Bring one short public-domain poem.\n\nRegister by 20 October.\nRegistration method not supplied.\n", "v3-optional-closing.txt": "Riverside Reading Circle\nSaturday, 24 October 2026, 14:00–16:00\nMaple Room, Eastside Community Centre\nFree. Bring one short public-domain poem.\n\nRegister by 20 October.\nRegistration method not supplied.\n\nWe look forward to sharing the pleasure of poetry and a thoughtful afternoon together.\n"};
const source=`Riverside Reading Circle
Saturday, 24 October 2026
14:00–16:00
Maple Room, Eastside Community Centre
Free
Bring one short public-domain poem
Register by 20 October`;
const limitation='Registration method not supplied. No link, address or contact person is invented. Classroom example only; obtain a confirmed method before real publication.';
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const panel=(title,body)=>`<article><h2>${escapeHTML(title)}</h2>${body}</article>`;
const text=s=>`<pre>${escapeHTML(s)}</pre>`;
const table=rows=>`<table><thead><tr><th>Requirement</th><th>Current result</th><th>Needed correction</th><th>Pass or fail</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===3?' class="'+(c==='Pass'?'pass':c==='Fail'?'fail':'optional')+'"':''}>${escapeHTML(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const states=['Source notes','Task brief','Acceptance worksheet','Must-haves and preferences','Initial prompt','First weak output','Purpose failure','Deadline failure','Unsupported claim','Targeted factual correction','Revised factual notice','Factual comparison','Dense board preview','Destination failure','Structure instruction','Version 2','Count words','All must-haves checked','Optional closing instruction','Version 3','Compare versions','Accepted version','Stop rule','Evidence and draft','Missing information','Manual editor','Decision record'];
const initialPrompt='Using only the supplied notes, draft a warm community-board notice of no more than 90 words. Include the registration action. Label any missing information instead of guessing.';
const v1=versions['v1-factual-correction.txt'],v2=versions['v2-selected-notice.txt'],v3=versions['v3-optional-closing.txt'];
const facts=[['Title','Riverside Reading Circle'],['Date and time','Saturday, 24 October 2026; 14:00–16:00'],['Place','Maple Room, Eastside Community Centre'],['Price','Free'],['Bring','one short public-domain poem'],['Registration deadline','20 October']];
let current=0;
function render(){const state=states[current];document.getElementById('state').value=current;document.getElementById('appName').textContent=[4,5,9,10,14,15,18,19].includes(current)?'ClearTask Assistant':'ClearTask Worksheet';let body='';switch(current){
case 0:body=panel('Opened evidence — self-authored fictional notes',text(source));break;
case 1:body=panel('Task brief',text('Create a notice for the community message board. Maximum 90 words. Make the action clear.'));break;
case 2:body=panel('Acceptance conditions',table([...facts.map(([a,b])=>[a,b,'Check against opened source','Not checked']),['No invented details','Audience and method not supplied','Label gaps, never guess','Not checked'],['Maximum 90 words','Count actual words','Check after final edit','Not checked']]));break;
case 3:body=panel('Must-haves',text('Confirmed facts · No invented details · At most 90 words · Visible registration action'))+panel('Preferences',text('Warm tone · Inviting closing — optional'));break;
case 4:body=panel('Initial prompt',text(initialPrompt));break;
case 5:body=panel('Prepared fictional weak output',text(versions['first-weak-output.txt']))+panel('Checking notes',text('Missing: Register by 20 October
Unsupported: Everyone is welcome'));break;
case 6:body=panel('Purpose',table([['Purpose','Reader cannot see registration deadline','Add supplied deadline','Fail']]));break;
case 7:body=panel('Registration deadline',table([['Registration deadline','Output value: blank; source: 20 October','Add exact deadline','Fail']]));break;
case 8:body=panel('No invented details',table([['No invented details','Everyone is welcome; source: Not stated','Remove or label as unknown','Fail']]));break;
case 9:body=panel('Targeted revision instruction',text('Add the registration deadline exactly as supplied. Remove the unsupported audience claim. Preserve every other confirmed detail.'));break;
case 10:body=panel('Revision 1 — factual correction',text(v1));break;
case 11:body='<div class="grid">'+panel('Factual comparison',table(facts.map(([a,b])=>[a,b,'None','Pass'])))+panel('Opened source notes',text(source))+'</div>';break;
case 12:body=panel('Community message-board preview',`<p class="big">${escapeHTML(v1)}</p>`);break;
case 13:body=panel('Destination check',table([['Usable on message board','Registration action buried in paragraph','Put registration action on its own final line','Fail']]));break;
case 14:body=panel('Targeted structure instruction',text('Keep the verified wording. Put the registration action on its own final line. Remain under 90 words.'));break;
case 15:body=panel('Version 2 — separated action',text(v2.replace('Register by 20 October.','')).replace('</pre>','</pre><p><strong>Register by 20 October.</strong></p>'));break;
case 16:body=panel('Manual word-count check',`<div id="wordTokens">${v2.trim().split(/\s+/).map((w,i)=>`<span>${i+1}. ${escapeHTML(w)}</span>`).join('')}</div><p class="pass">${v2.trim().split(/\s+/).length} whitespace-separated words — under 90: Pass</p>`);break;
case 17:body=panel('Requirement checks',table([...facts.map(([a,b])=>[a,b,'None','Pass']),['No invented details','Missing method labeled','None','Pass'],['Length','Under 90 words','None','Pass'],['Destination','Separate action','None','Pass'],['More engaging closing','Preference only','Optional','Optional']]));break;
case 18:body=panel('Optional third instruction',text('Make only the closing warmer. Preserve every verified fact, structure, and length requirement.'));break;
case 19:body=panel('Version 3 — optional closing',text(v3));break;
case 20:body=panel('Version comparison',table([['Version 2','Clearer and shorter','Select for this purpose','Pass'],['Version 3','Warmer but less direct','Not used: little net improvement','Optional']]));break;
case 21:body=panel('Accepted for the classroom comparison',text('Version 2: Accepted
Version 3: Not used
Reason: No worthwhile net improvement'));break;
case 22:body=panel('Stop rule',text('STOP when all must-haves pass, required checks are complete, the destination works, and another revision offers too little value.'));break;
case 23:body='<div class="grid">'+panel('Opened evidence',text(source))+panel('Prepared fictional draft — checked',text(v2))+'</div>';break;
case 24:body=panel('Assumptions and missing information',text(limitation));break;
case 25:body=panel('Plain document editor','<textarea id="editor" aria-label="Notice editor">'+escapeHTML(v2)+'</textarea><p id="editorStatus">Reviewed manually — inspect after every edit.</p><button id="checkEdit">Count current words</button>');break;
case 26:body=panel('Revision record',text('Accepted version: 2 (classroom comparison)
Requirements passed: confirmed facts, visible action, no invented details, length
Checks completed: source comparison and word count
Known limitation: registration method not supplied
Reason for stopping: no worthwhile net improvement
Real publication: held until organizer confirms method'));break;}
document.getElementById('main').innerHTML=body+`<aside class="note"><strong>Known limitation:</strong> ${escapeHTML(limitation)}</aside>`;const button=document.getElementById('checkEdit');if(button)button.onclick=()=>document.getElementById('editorStatus').textContent='Current word count: '+document.getElementById('editor').value.trim().split(/\s+/).filter(Boolean).length+'; recheck source facts after edits.';}
const select=document.getElementById('state');states.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s;select.append(o)});select.onchange=()=>{current=Number(select.value);render()};document.getElementById('prev').onclick=()=>{current=Math.max(0,current-1);render()};document.getElementById('next').onclick=()=>{current=Math.min(states.length-1,current+1);render()};document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['Accepted version: 2 (classroom example)\nKnown limitation: registration method not supplied\nReal publication held until organizer confirms method\nReason: further optional closing adds too little value'],{type:'text/plain'}));a.download='stop-rule-decision.txt';a.click();URL.revokeObjectURL(a.href)};render();
</script></html>
