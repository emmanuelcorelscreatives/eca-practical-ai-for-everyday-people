<!doctype html><html lang="en"><meta charset="utf-8"><title>Five-field source-checking worksheet</title><link rel="stylesheet" href="style.css"><nav><a href="index.html">Practice pack</a><a href="generated-example.html">Example</a></nav><aside>FICTIONAL PRACTICE · Edits remain in this tab only. Export before closing.</aside><h1>Checking worksheet</h1><table><thead><tr><th>Exact claim</th><th>Opened source</th><th>Supporting passage</th><th>Result</th><th>Correction or note</th></tr></thead><tbody id="rows"></tbody></table><p><button id="add">Add row</button> <button id="export">Export CSV</button></p><script>
const body=document.getElementById('rows');function add(claim=''){const tr=document.createElement('tr');for(let i=0;i<5;i++){const td=document.createElement('td');const el=document.createElement(i===3?'select':'textarea');if(i===3)for(const value of ['', 'Supported','Unsupported','Unresolved']){const o=document.createElement('option');o.textContent=value;el.append(o)}else if(i===0)el.value=claim;td.append(el);tr.append(td)}body.append(tr)}
['Opened on 14 May 2018','Serves exactly 1,200 residents each year','“the city’s most successful shared garden”','The Season Review reports 120 participating households','It expanded in 2026'].forEach(add);document.getElementById('add').onclick=()=>add();document.getElementById('export').onclick=()=>{const esc=s=>'"'+s.replaceAll('"','""')+'"';const values=[['Exact claim','Opened source','Supporting passage','Result','Correction or note'],...Array.from(body.rows,r=>Array.from(r.querySelectorAll('textarea,select'),e=>e.value))];const url=URL.createObjectURL(new Blob([values.map(r=>r.map(esc).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='lesson49-checking-worksheet.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
