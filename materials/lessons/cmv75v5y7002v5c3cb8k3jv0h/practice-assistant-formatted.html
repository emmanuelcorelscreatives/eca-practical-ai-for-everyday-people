<!doctype html><html lang="en"><meta charset="utf-8"><title>lesson19-trip-demo</title><style>
*{box-sizing:border-box}body{font:21px system-ui;color:#152337;background:#edf2f8;margin:0;padding:40px 90px}header{font-size:29px;font-weight:700}small{font-size:16px;font-weight:400}nav{display:flex;gap:25px;margin:24px 0}button{font:inherit;background:white;border:1px solid #aab7c8;border-radius:6px;padding:10px 18px;cursor:pointer}section{border:1px solid #b9c8d7;background:#fff;border-radius:7px;margin:20px 0;padding:22px}h2{font-size:22px;margin:0 0 16px}textarea{font:inherit;width:100%;min-height:130px;padding:16px}#answer{white-space:pre-wrap;line-height:1.65}.note{color:#52647a;font-size:15px}label{display:block;line-height:1.6}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
</style><header>Practice Assistant <small>1.0 | lesson19-trip-demo</small></header><nav><button onclick="show('notes')">Notes</button><button onclick="show('assistant')">Assistant</button><button onclick="show('criteria')">Acceptance checks</button></nav><main id="view"></main><script>
const recorded={"notes": "Put the water bottle by the door. Pack the phone charger. Download the route map. Leave at 08:15. Check that the windows are closed.", "vague": {"at": "2026-11-12T08:36:39.220Z", "prompt": "Organize these notes.", "notes": "Put the water bottle by the door. Pack the phone charger. Download the route map. Leave at 08:15. Check that the windows are closed.\n", "model": "combo/planning", "data": {"text": "Before leaving, download the route map, pack the phone charger, and put the water bottle by the door. Check that the windows are closed, then leave at 08:15."}}, "concrete": {"at": "2026-11-12T08:22:39.499Z", "prompt": "Turn the supplied notes into a pre-departure checklist. Use one checkbox per action, include every supplied action, preserve the stated time, and add nothing.", "notes": "Put the water bottle by the door. Pack the phone charger. Download the route map. Leave at 08:15. Check that the windows are closed.\n", "model": "combo/planning", "data": {"text": "- [ ] Put the water bottle by the door.\n- [ ] Pack the phone charger.\n- [ ] Download the route map.\n- [ ] Leave at 08:15.\n- [ ] Check that the windows are closed."}}};const concretePrompt=recorded.concrete.prompt;const notes=recorded.notes;const view=document.querySelector('#view');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function source(){return '<section><h2>Self-created practice notes</h2>'+esc(notes)+'</section>'}
function show(tab){if(tab==='notes'){view.innerHTML=source();return}if(tab==='criteria'){view.innerHTML='<section><h2>Acceptance checks</h2><label>Requested artifact</label><label>Every supplied action</label><label>No unsupported additions</label><label>08:15 preserved exactly</label></section>';return}view.innerHTML=source()+'<section><h2>Assistant</h2><textarea id="prompt">Organize these notes.</textarea><p><button onclick="useConcrete()">Use concrete request</button> <button onclick="send()">Send</button></p><p class="note">Course-built local practice app. This demonstration replays recorded AI drafts for these exact notes and requests; it does not make a new AI call.</p></section><section id="result" hidden><h2>GENERATED DRAFT</h2><p class="note">Display formatting: Markdown task markers become checkbox glyphs. Recorded wording is unchanged.</p><div id="answer"></div><button onclick="copy()">Copy draft</button></section>'}
function useConcrete(){document.querySelector('#prompt').value=concretePrompt}
function send(){const p=document.querySelector('#prompt').value.trim(),result=document.querySelector('#result'),answer=document.querySelector('#answer');result.hidden=false;if(p!==concretePrompt&&p!=='Organize these notes.'){answer.textContent='This recorded exercise supports only the two supplied requests. Use your own general assistant for a different prompt.';return}answer.textContent='Generating draft... (recorded state)';setTimeout(()=>{answer.textContent=p===concretePrompt?recorded.concrete.data.text.replace(/^- \[ \] /gm,'☐ '):recorded.vague.data.text},700)}
async function copy(){await navigator.clipboard.writeText(document.querySelector('#answer').textContent)}
show(new URLSearchParams(location.search).get('tab')||'notes');
</script></html>
