<!doctype html><html lang="en"><meta charset="utf-8"><title>Riverlight — Handoff Practice</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#172537;font:24px Arial,sans-serif}#app{margin:5vh 6vw;background:white;border:1px solid #cad3df;min-height:90vh;padding:35px 42px}header{display:flex;gap:25px;align-items:center;border-bottom:2px solid #dce3ed;padding-bottom:22px;margin-bottom:23px}h1{font-size:34px;margin:0;flex:1}h2{font-size:29px;margin:12px 0 18px}h3{font-size:25px;margin:12px 0}p{line-height:1.42;margin:10px 0}.tag{background:#e4edf7;color:#29435e;padding:9px 14px;font-size:21px;border-radius:5px}.warn{background:#fff3c9;border-left:6px solid #be8800;padding:16px 20px;margin:15px 0}.error{background:#fff0ed;border-left:6px solid #b32828;padding:15px}select,button{font:20px Arial;padding:10px;border:1px solid #acb8c7;background:white;border-radius:5px}button{cursor:pointer;color:#17496e}.toolbar{display:flex;gap:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}.panel{border:1px solid #c9d3df;padding:20px;background:#fafcff}.meta{font-size:20px;color:#40536b;line-height:1.6;margin:12px 0 23px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #acb9c8;padding:13px 11px;text-align:left;vertical-align:top;line-height:1.3;overflow-wrap:break-word;font-size:21px}th{background:#e8eef5;font-size:20px}th:nth-child(1){width:7%}th:nth-child(2){width:10%}th:nth-child(3){width:14%}th:nth-child(4){width:20%}th:nth-child(5){width:9%}th:nth-child(6){width:9%}th:nth-child(7){width:9%}th:nth-child(8){width:22%}tr.active td{background:#e8f4fd}td.missing{background:#fff0bc!important}.smalltable th,.smalltable td{font-size:18px;padding:9px}.compact{font-size:20px;line-height:1.45;white-space:pre-wrap;margin:0}.draft{font-size:25px;line-height:1.55;white-space:pre-wrap}.source{font-size:28px;white-space:pre-wrap;line-height:1.55}textarea{width:100%;min-height:240px;font:21px/1.5 monospace;padding:15px;border:1px solid #aabbcc}#result{color:#12633e;font-weight:bold}.flow{display:flex;align-items:stretch;gap:24px;margin-top:100px}.flow>div{flex:1;padding:40px 15px;background:#e8f2fa;border:1px solid #9cbbd2;text-align:center}.flow span{font-size:50px;align-self:center}.check{padding:13px 18px;border-left:5px solid #2c8359;background:#edf7f0;margin:12px 0}.notes{font-size:22px}.node{border:1px solid #adc1d3;margin:14px 0;padding:14px;background:#f6fafc}.caption{font-size:19px;color:#5a6b7d;margin-top:20px}code{white-space:pre-wrap}a{color:#205d8e}
</style><main id="app"><header><h1>Riverlight Community Day</h1><span class="tag">Fictional training material</span><select id="state" aria-label="Practice state"></select></header><div id="view"></div><div class="caption">Emmanuel Corels Academy · Handoff Practice · Offline course application</div></main><script>
const DATA={"title": "Riverlight Community Day — approved information handoff", "purpose": "Create a public information draft", "handoffVersion": "1.0", "preparedFrom": "two opened fictional source documents", "generatedInterpretation": "none", "records": [{"Item ID": "EVT-001", "Field": "Event schedule", "Verified value": "2026-11-14, 10:00–15:00", "Source title": "Riverlight Community Day — Approved Event Brief", "Source location": "Schedule", "Source date": "2026-10-10", "Status": "VERIFIED", "Notes": "Local time; time zone not stated."}, {"Item ID": "EVT-002", "Field": "Venue", "Verified value": "Harbor Hall, 18 Cedar Lane", "Source title": "Riverlight Community Day — Approved Event Brief", "Source location": "Venue", "Source date": "2026-10-10", "Status": "VERIFIED", "Notes": ""}, {"Item ID": "EVT-003", "Field": "Step-free access", "Verified value": "East entrance", "Source title": "Riverlight Community Day — Venue Access Note", "Source location": "Access", "Source date": "2026-10-11", "Status": "VERIFIED", "Notes": "Accessible parking information not supplied."}, {"Item ID": "EVT-004", "Field": "Admission price", "Verified value": "[MISSING]", "Source title": "Riverlight Community Day — Approved Event Brief", "Source location": "Admission", "Source date": "2026-10-10", "Status": "MISSING", "Notes": "Price not yet approved; do not estimate."}]},DOCS=["Riverlight Community Day — Approved Event Brief\nFictional training material\nVersion: 1.2\nSource date: 2026-10-10\n\nSchedule\n2026-11-14, 10:00–15:00\nLocal time; time zone not stated.\n\nVenue\nHarbor Hall, 18 Cedar Lane\n\nAdmission\nPrice not yet approved.\n", "Riverlight Community Day — Venue Access Note\nFictional training material\nVersion: 1.0\nSource date: 2026-10-11\n\nAccess\nStep-free access: East entrance.\nAccessible parking arrangements: not supplied.\n"],GENERATED="Riverlight Community Day\n\nSchedule: 2026-11-14, 10:00–15:00. Local time; time zone not stated.\nVenue: Harbor Hall, 18 Cedar Lane\nStep-free access: East entrance\nAccessible parking: To be confirmed (information not supplied).\nAdmission: To be confirmed.\n\nSource notes:\nEVT-001 — Source title: Riverlight Community Day — Approved Event Brief; Source location: Schedule; Source date: 2026-10-10.\nEVT-002 — Source title: Riverlight Community Day — Approved Event Brief; Source location: Venue; Source date: 2026-10-10.\nEVT-003 — Source title: Riverlight Community Day — Venue Access Note; Source location: Access; Source date: 2026-10-11.\nEVT-004 — Source title: Riverlight Community Day — Approved Event Brief; Source location: Admission; Source date: 2026-10-10.";
const names=['Corrupted summary','Workflow','Evidence Viewer','Approved Event Brief','Venue Access Note','Empty handoff','Stable identifiers','Schedule row','Venue row','Access row','Admission row','Complete handoff','AI Assistant input','AI Assistant saved draft','Verification','Provenance','Document Output','Document review','Damaged paste','Plain-text fallback','Fallback comparison'];
const view=document.querySelector('#view'),sel=document.querySelector('#state');names.forEach((x,i)=>sel.add(new Option(x,i)));let current=0;
function e(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const fields=Object.keys(DATA.records[0]);
function meta(){return '<h2>'+e(DATA.title)+'</h2><div class="meta">Purpose: Create a public information draft · Handoff version: 1.0<br>Prepared from: two opened fictional source documents · Generated interpretation: none</div>'}
function table(mode=4,compact=false){return '<table class="'+(compact?'smalltable':'')+'"><thead><tr>'+fields.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr></thead><tbody>'+DATA.records.map((r,i)=>'<tr class="'+(mode===i+1?'active':'')+'">'+fields.map((f,j)=>'<td '+''+'class="'+(i===3&&mode>=4&&['Verified value','Status'].includes(f)?'missing':'')+'">'+(mode===-2?'':mode===-1?(j===0?e(r[f]):''):i<mode?e(r[f]):j===0?e(r[f]):'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function brief(){return '<h2>Evidence Viewer — Approved Event Brief</h2><pre class="source">'+e(DOCS[0])+'</pre>'}
function fallback(records=DATA.records){let t='TITLE: '+DATA.title+'\nPURPOSE: Create a public information draft\nVERSION: 1.0\n\n';for(const r of records)t+='RECORD '+r['Item ID']+'\n'+['ITEM ID','FIELD','VALUE','SOURCE','SOURCE LOCATION','SOURCE DATE','STATUS','NOTES'].map((k,i)=>k+': '+r[fields[i]]).join('\n')+'\n\n';return t}
function sourceNotes(){return DATA.records.map(r=>'<div class="node"><b>'+e(r['Item ID'])+'</b> → '+e(r['Source title'])+'<br>'+e(r['Source location'])+' · '+e(r['Source date'])+'<br>'+e(r['Notes'])+'</div>').join('')}
function draft(){return '<div class="warn">GENERATED DRAFT — CHECK AGAINST HANDOFF</div><div class="meta">Saved actual AI transformation response; not approved evidence.</div><pre class="draft">'+e(GENERATED)+'</pre>'}
function checkDraft(){const required=['2026-11-14','10:00','15:00','Harbor Hall, 18 Cedar Lane','East entrance','To be confirmed',...DATA.records.map(r=>r['Item ID'])];return required.every(v=>GENERATED.toLowerCase().includes(v.toLowerCase()))}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(n){current=n;sel.value=String(n);let s='';if(n===0)s='<div class="grid"><div class="panel">'+brief()+'</div><div class="panel"><h2>Incorrect transferred summary</h2><p class="error">Date: 2026-11-15</p><p>Harbor Hall, 18 Cedar Lane</p><p class="error">Admission: £5</p><p class="warn">Intentionally incorrect exercise example</p></div></div>';
if(n===1)s='<h2>Stable handoff workflow</h2><div class="flow"><div>Approved evidence<br><b>Two opened sources</b></div><span>→</span><div>Labelled handoff table<br><b>EVT-001–EVT-004</b></div><span>→</span><div>AI transformation<br><b>Draft to check</b></div><span>→</span><div>Final document<br><b>Human review</b></div></div>';
if(n===2)s='<h2>Evidence Viewer</h2><div class="panel"><h3>Riverlight Community Day — Approved Event Brief</h3><p>Version 1.2 · Source date 2026-10-10</p><button onclick="render(3)">Open approved brief</button></div><br><div class="panel"><h3>Riverlight Community Day — Venue Access Note</h3><p>Version 1.0 · Source date 2026-10-11</p><button onclick="render(4)">Open access note</button></div>';
if(n===3)s=brief();if(n===4)s='<h2>Evidence Viewer — Venue Access Note</h2><pre class="source">'+e(DOCS[1])+'</pre>';
if(n>=5&&n<=11){s=meta()+'<div class="toolbar"><button onclick="download(\'handoff.txt\',fallback())">Export labelled plain text</button><button onclick="render(14)">Verify handoff</button></div>'+table(n===5?-2:n===6?-1:n-6);if(n===6)s='<h2>'+e(DATA.title)+'</h2><p>Use only opened, approved evidence.</p>'+table(-1)}
if(n===12)s='<h2>AI Assistant — handoff input</h2><div class="panel"><h3>Instructions</h3><p>Draft a short public information note. Use only VERIFIED values. Keep item IDs in source notes. Show MISSING information as ‘To be confirmed.’ Do not add details.</p></div>'+meta()+table(4);
if(n===13)s='<h2>AI Assistant — saved response</h2>'+draft();
if(n===14)s='<h2>Compare handoff with generated draft</h2>'+table(4,true)+'<div class="grid"><div class="panel"><h3>Generated draft — checked facts</h3><p>2026-11-14, 10:00–15:00<br>Harbor Hall, 18 Cedar Lane<br>Step-free access: East entrance<br>Admission: To be confirmed</p><p>EVT-001 · EVT-002 · EVT-003 · EVT-004</p><p>Local time; time zone not stated<br>Accessible parking information not supplied.</p></div><div class="panel"><button id="verify" onclick="document.querySelector(\'#result\').textContent=checkDraft()?\'4 records; four identifiers and required values present. Check source relationships manually.\':\'Draft does not match required values\'">Run exact-value check</button><p id="result"></p><div class="check">Record count: '+DATA.records.length+'</div><div class="check">Identifiers: '+DATA.records.map(r=>r['Item ID']).join(', ')+'</div><div class="check">Exact names and dates retained</div><div class="warn">Missing admission preserved; no parking claim</div></div></div>';
if(n===15)s='<h2>Provenance and caveats</h2><div class="grid"><div><h3>Handoff source references</h3>'+sourceNotes()+'</div><div><h3>Generated draft source notes</h3>'+sourceNotes()+'</div></div>';
if(n===16||n===17)s='<h2>Document Output</h2><div class="warn">Draft for human review</div><div class="grid"><div class="panel"><h2>Riverlight Community Day</h2><p>2026-11-14, 10:00–15:00<br>Harbor Hall, 18 Cedar Lane<br>Step-free access: East entrance<br>Admission: To be confirmed</p><p>Local time; time zone not stated.<br>Accessible parking: Information not supplied.</p></div><div class="notes"><h3>Source notes</h3>'+sourceNotes()+'</div></div>';
if(n===18)s='<h2>Table Editor — damaged paste</h2><p class="warn">Transfer failed: use labelled plain text</p><textarea id="paste">EVT-001 Event schedule 2026-11-14, 10:00–15:00\nEVT-002 Venue Harbor Hall, 18 Cedar Lane\nEVT-003 East entrance VERIFIED\nEVT-004 [MISSING] MISSING\nApproved Event Brief — Admission — 2026-10-10</textarea><p class="error">Intentional transfer failure: columns collapsed; source references detached.</p><button onclick="render(19)">Return to original labelled package</button>';
if(n===19)s='<h2>Labelled plain-text fallback</h2><pre class="source" style="font-size:25px">'+e(fallback([DATA.records[3]]))+'</pre><button onclick="download(\'handoff-full.txt\',fallback())">Export all four complete records</button>';
if(n===20){let value=fallback();s='<h2>Compare original with pasted destination</h2><div class="grid"><div><h3>Original labelled package</h3><textarea id="original" readonly>'+e(value)+'</textarea></div><div><h3>Pasted destination</h3><textarea id="destination">'+e(value)+'</textarea></div></div><button id="compare" onclick="document.querySelector(\'#result\').textContent=document.querySelector(\'#destination\').value===fallback()?DATA.records.length+\' of \'+DATA.records.length+\' records matched\':\'Transfer mismatch — return to original\'">Compare complete blocks</button><p id="result"></p>'+table(4,true)}view.innerHTML=s;window.lessonState=()=>({state:n,name:names[n],recordCount:DATA.records.length,exactDraftValuesPresent:checkDraft(),table:dataSnapshot()})}
function dataSnapshot(){return structuredClone(DATA)}sel.addEventListener('change',()=>render(Number(sel.value)));render(Number(new URLSearchParams(location.search).get('state')||0));
</script></html>
