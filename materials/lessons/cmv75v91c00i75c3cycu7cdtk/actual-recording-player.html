<!doctype html><meta charset="utf-8"><title>Synthetic Academy workshop playback</title><style>*{box-sizing:border-box}body{font:24px Arial;background:#e8edf2;color:#162c3d;margin:0}main{margin:90px 160px;width:1600px;height:900px;padding:32px;background:white;border:1px solid #adc1cd}h1{font-size:32px}p{line-height:1.35}button{font:22px Arial;padding:12px;margin:6px}audio{width:100%;height:50px}canvas{width:100%;height:160px;background:#edf5f7}#transcript{font:22px/1.35 Arial;white-space:pre-wrap;max-height:350px;overflow:auto;padding:15px;border:1px solid #acbdc9}#status{font-size:19px}</style><main><h1>SYNTHETIC Academy workshop — actual local audio</h1><p>Self-authored fiction · eSpeak teaching voices · no real meeting or ASR-output claim</p><button id="full">Full workshop</button><button id="booking">Booking replay</button><button id="correct">Correct seeded “look” after listening</button><p id="status">Load supplied audio to inspect its actual PCM waveform.</p><audio id="audio" controls></audio><canvas id="wave" width="1530" height="160"></canvas><div id="transcript"></div></main><script>const lines="Maya: The library room is available Thursday, 18 June, from 6 to 8 p.m.\nJon: I’ll book the room today.\nMaya: Agreed.\nLeila: We could offer tea.\nJon: That sounds good.\nMaya: Should we cap attendance at 30?\nLeila: I don’t know; we need the room layout.\nJon: If the booking is confirmed, I’ll send the invitation on Friday.\nMaya: Let’s use paper sign-in sheets.\nLeila: Yes, agreed.";let mode='full';const a=document.querySelector('#audio');window.ready=false;async function load(which){mode=which;window.ready=false;const name=which==='booking'?'synthetic-booking.wav':'synthetic-workshop.wav';a.src=name;const raw=await fetch(name).then(r=>r.arrayBuffer());const ctx=new AudioContext();const data=await ctx.decodeAudioData(raw);const pcm=data.getChannelData(0),canvas=document.querySelector('#wave'),g=canvas.getContext('2d');g.clearRect(0,0,1530,160);g.strokeStyle='#14687b';g.beginPath();for(let x=0;x<1530;x++){let min=0,max=0;let j=Math.floor(x*pcm.length/1530),end=Math.floor((x+1)*pcm.length/1530);for(;j<end;j++){min=Math.min(min,pcm[j]);max=Math.max(max,pcm[j]);}g.moveTo(x,80+min*70);g.lineTo(x,80+max*70);}g.stroke();await ctx.close();document.querySelector('#transcript').textContent=which==='booking'?'Seeded exercise alternate — not an ASR observation:\nJon: I’ll look at the room today.':lines;document.querySelector('#status').textContent='Actual PCM decoded: '+data.sampleRate+' Hz · '+data.duration.toFixed(2)+' seconds · playback not yet verified';window.ready=true;}document.querySelector('#full').onclick=()=>load('full');document.querySelector('#booking').onclick=()=>load('booking');document.querySelector('#correct').onclick=()=>{if(mode==='booking'&&a.currentTime>0){document.querySelector('#transcript').textContent='After replay — confirm only if audible:\nJon: I’ll book the room today.\nSeeded alternate “I’ll look at the room today” rejected.';}else document.querySelector('#status').textContent='Play the supplied booking excerpt first; do not claim an unperformed check.'};a.onplay=()=>document.querySelector('#status').textContent='Actual synthetic source is playing; listen before correcting.';load('full');</script>
