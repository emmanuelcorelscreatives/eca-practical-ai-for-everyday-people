<!doctype html><html lang="en"><meta charset="utf-8"><title>Section Desk v1.0 — Academy manual trainer</title><style>body{font:18px system-ui;background:#f5f7fa;color:#182433;max-width:1050px;margin:30px auto}textarea{width:100%;height:130px;box-sizing:border-box}button{padding:12px}label{display:block;margin-top:20px}strong{color:#245886}</style><h1>Section Desk v1.0</h1><p><strong>Fictional course workflow • real local manual trainer • no AI engine or network</strong></p><label>1. Unchanged shared instruction<textarea id="task"></textarea></label><label>2. Checked handoff note<textarea id="note"></textarea></label><label>3. Current source section — preserve S01–S06 and original page labels<textarea id="source"></textarea></label><label>Opened source passages — copy verbatim, then check<textarea id="passages"></textarea></label><label>Generated or manual notes — unverified until checked<textarea id="result"></textarea></label><label>Assumptions, missing information and conflicts<textarea id="open"></textarea></label><button id="save">Download checked handoff working copy</button><p>No automatic checking or long-term memory is claimed. Only click download after source comparison.</p><script>document.getElementById('save').onclick=()=>{const text=['SHARED INSTRUCTION','task','CHECKED HANDOFF','note','CURRENT SOURCE','source','OPENED PASSAGES','passages','WORKING NOTES','result','OPEN QUESTIONS','open'].map(x=>document.getElementById(x)?.value??x).join('\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='section-handoff-working-copy.txt';a.click();URL.revokeObjectURL(a.href)};</script></html>
