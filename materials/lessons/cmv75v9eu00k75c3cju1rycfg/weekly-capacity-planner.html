<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Weekly Capacity Planner | Emmanuel Corels Academy</title><style>body{margin:0;background:#edf2f7;color:#142a3c;font:22px Arial,sans-serif}main{max-width:1500px;margin:auto;padding:80px 100px}header{border-bottom:3px solid #087f8c;margin-bottom:28px}h1{font-size:38px}h2{font-size:30px}p{line-height:1.5}select,button,input{font:inherit;padding:12px;border:1px solid #60788c;border-radius:6px}section{background:white;border:1px solid #bbcbd7;padding:28px;margin:24px 0;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:22px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ccd8e2}th{background:#e4f4f5}.badge{display:inline-block;padding:9px;background:#d4efe9;border-radius:6px;font-weight:bold}label{display:block;margin:15px 0}aside{background:#fff0d2;padding:20px}.bar{height:44px;background:#087f8c;margin:12px 0;color:white;padding:10px;box-sizing:content-box}small{font-size:18px}textarea{width:95%;height:100px;font:inherit}</style><main><header><small>Emmanuel Corels Academy · Lesson 123 · Fictional practice data</small><h1>Weekly Capacity Planner</h1><p>Self-created offline teaching worksheet. No assistant connection. No calendar events saved.</p></header><label>Teaching state <select id="state"></select></label><div id="view"></div><footer><small>Real dates, time zone, energy and unlisted commitments remain unknown. Review before any real calendar entry.</small></footer></main><script>
const DATA={"windows": [["Monday", "19:00", "21:00", 120], ["Tuesday", "20:00", "21:30", 90], ["Thursday", "19:00", "21:00", 120], ["Friday", "18:30", "20:00", 90], ["Saturday", "10:00", "13:00", 180], ["Sunday", "15:00", "18:00", 180]], "tasks": [["Study", 240, 240, "Protected priority"], ["Personal project", 180, 0, "Deferred to a later week"], ["Groceries", 90, 90, "Protected priority"], ["Laundry", 90, 90, "Protected priority"], ["Cleaning", 120, 60, "Essential cleaning only; remaining scope not complete"], ["Administration", 60, 60, "Protected priority"], ["Family call", 60, 60, "Selected"]], "schedule": [["Monday", "19:00", "20:00", "Administration", 60], ["Tuesday", "20:00", "21:30", "Laundry", 90], ["Thursday", "19:00", "21:00", "Study", 120], ["Friday", "18:30", "19:30", "Essential cleaning only", 60], ["Saturday", "10:00", "11:30", "Groceries", 90], ["Saturday", "12:00", "13:00", "Family call", 60], ["Sunday", "15:00", "17:00", "Study", 120]]};const names=['Overview','Fixed commitments','Available windows','Capacity calculation','Requested tasks','Overfilled draft','Assistant constraints','Mismatch and missing information','Human choices','Revised list','Reviewed schedule','Arithmetic check','Overlap and transitions','Final review','Calendar draft','Calendar form','Manual fallback','Final checklist','Capacity summary'];let selector=document.querySelector('#state');names.forEach((n,i)=>selector.add(new Option(n,i)));function table(headers,rows){return '<table><thead><tr>'+headers.map(v=>'<th>'+v+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function render(){let i=+selector.value;let v='';if(i==0)v='<h2>Plan around real limits</h2><section>Fixed commitments: work, care, travel, Wednesday appointment and personal unavailable time</section><section>Available windows: six windows, 13 hours total</section><section>Flexible tasks: 14 hours requested before human choices</section>';if(i==1)v='<h2>Fixed commitments remain unchanged</h2><section>Work · Care responsibilities · Travel · Wednesday appointment</section><aside>Sleep, meals, recovery and personal unavailable time are also excluded. Exact fixed-event times are not supplied; an empty box is not automatically available.</aside>';if(i==2)v='<h2>Available windows</h2>'+table(['Day','Start','End','Hours'],DATA.windows.map(r=>[...r.slice(0,3),r[3]/60]))+'<p class="badge">13 hours available</p>';if(i==3)v='<h2>13 hours available − 2 hours reserved buffer = 11 hours usable capacity</h2><aside>Adjustable assumption, not a universal rule.</aside>';if(i==4)v='<h2>Requested flexible tasks</h2>'+table(['Task','Requested hours'],DATA.tasks.map(r=>[r[0],r[1]/60]))+'<p class="badge">14 requested − 11 usable = 3 hours over capacity</p>';if(i==5)v='<h2>Illustrative overfilled draft</h2><section>“Put all these tasks into my week.”</section><aside>14 requested hours exceed 11 usable hours. No accepted schedule. Do not silently use the protected buffer.</aside>';if(i==6)v='<h2>Illustrative General Assistant · input draft</h2><section>Available windows: Monday 2 h; Tuesday 1.5 h; Thursday 2 h; Friday 1.5 h; Saturday 3 h; Sunday 3 h.</section><section>Usable capacity 11 h. Requested tasks 14 h. Protect study, groceries, laundry and administration.</section><aside>Do not exceed usable capacity. Keep fixed commitments unchanged. Label assumptions, identify conflicts and leave lower-priority work unscheduled when necessary. Return a draft weekly table and total planned hours.</aside>';if(i==7)v='<h2>Illustrative General Assistant · draft analysis</h2><section>14 requested hours vs 11 usable hours: 3-hour overload</section><aside>Missing information: energy levels, unlisted commitments, real dates and time zone. Human choices required. This is a teaching example, not a live model response.</aside>';if(i==8)v='<h2>Human choices</h2><section>Defer personal project: 3 h to a later week</section><section>Reduce cleaning: 2 h → essential cleaning only: 1 h</section><aside>Study, groceries, laundry and administration remain protected.</aside>';if(i==9)v='<h2>Revised task list</h2>'+table(['Task','Selected hours','Status'],DATA.tasks.map(r=>[r[0],r[2]/60,r[3]]))+'<p>10 hours selected; 1 usable hour unassigned; original 2-hour buffer protected.</p>';if(i==10||i==12)v='<h2>Reviewed fictional weekly draft</h2>'+table(['Day','Start','End','Task','Hours'],DATA.schedule.map(r=>[...r.slice(0,4),r[4]/60]))+'<p class="badge">10 hours planned · no overlaps · transitions included · fixed commitments unchanged</p><aside>Saturday 11:30–12:00: 30-minute transition. Compare against your real fixed commitments separately.</aside>';if(i==11)v='<h2>Independent arithmetic</h2><section>1 + 1.5 + 2 + 1 + 1.5 + 1 + 2 = 10 hours</section><section>10 planned ≤ 11 usable: capacity check passes</section><aside>Arithmetic alone does not prove your energy, unlisted commitments or real calendar entries.</aside>';if(i==13)v='<h2>Final review</h2>'+table(['Scheduled','Protected buffer','Unscheduled'],[['10 hours','2 hours','Personal project: 3 hours'],['Essential cleaning only: 1 hour','Adjustable assumption','Second cleaning hour removed scope, not complete']])+'<p>1 additional usable hour remains unassigned.</p>';if(i==14)v='<h2>Neutral calendar teaching draft</h2><aside>Draft reviewed; events not yet saved.</aside><section>Source: administration Monday 19:00–20:00</section><section>Calendar destination: empty. No external account connected.</section>';if(i==15)v='<h2>Calendar event review form — illustrative only</h2><label>✓ Title <input value="Administration"></label><label>✓ Date <input placeholder="Choose actual Monday date"></label><label>✓ Start <input value="19:00"></label><label>✓ End <input value="20:00"></label><label>✓ Time zone <input placeholder="Verify your actual zone"></label><label>✓ Recurrence <input value="None — verify"></label><label>✓ Reminder <input placeholder="Select and verify"></label><button disabled>Save disabled — offline rehearsal</button>';if(i==16)v='<h2>Manual fallback — plain digital planner</h2><section>Copy fixed commitments → list workable windows → subtract buffer → select priorities</section><section>Reviewed schedule: 10 hours. Protected buffer: 2 hours. Unassigned: 1 hour.</section><aside>Unscheduled: personal project 3 hours. Essential cleaning only 1 hour; remaining scope not complete.</aside>';if(i==17)v='<h2>Final checklist</h2><section>□ No overlaps<br><br>□ Transitions realistic<br><br>□ Unscheduled tasks visible<br><br>□ Planned work does not exceed usable capacity</section>';if(i==18)v='<h2>Capacity summary</h2><div class="bar" style="width:90%">13 hours available</div><div class="bar" style="width:76%">11 hours usable after buffer</div><div class="bar" style="width:69%">10 hours scheduled</div><section>3-hour personal project remains unscheduled.</section>';document.querySelector('#view').innerHTML=v}selector.onchange=render;let q=+new URLSearchParams(location.search).get('state');selector.value=Number.isFinite(q)&&q>=0&&q<names.length?q:0;render();</script></html>
